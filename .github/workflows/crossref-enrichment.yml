name: Manual Crossref enrichment and audit

on:
  workflow_dispatch:
    inputs:
      reference_branch:
        description: Read-only verification branch containing LITERATURE_BASE.csv
        required: true
        default: arena/04fdf32e-le
        type: string

permissions:
  contents: write

concurrency:
  group: crossref-enrichment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout manuscript branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Checkout read-only literature base and generator
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.reference_branch }}
          path: verification-reference
          fetch-depth: 1

      - name: Run R3a Crossref verification for Sections 4.1–4.12
        run: |
          python3 phase5/scripts/crossref_enrich.py \
            --base-csv verification-reference/verification/LITERATURE_BASE.csv \
            --local-bib phase5/master/references_local.bib \
            --raw-dir phase5/reports/crossref_raw \
            --references-dir phase5/reports \
            --plan-csv verification-reference/verification/REFERENCE_PLAN.csv \
            --citation-map-csv verification-reference/verification/CITATION_MAP.csv \
            --row-index-csv verification-reference/verification/api_log/LITERATURE_ROW_INDEX.csv \
            --report-dir phase5/reports \
            --pause 1.0

      - name: Summarize R3a verification outputs
        run: |
          python3 - <<'PY'
          import csv
          from collections import Counter
          from pathlib import Path
          path = Path("phase5/reports/CROSSREF_VERIFY.csv")
          with path.open(newline="", encoding="utf-8-sig") as f:
              rows = list(csv.DictReader(f))
          print(f"CROSSREF_VERIFY.csv: {len(rows)} plan rows")
          print("status counts:", dict(Counter(row["status"] for row in rows)))
          print("bib-ready entries:", sum(row["bib_ready"] == "YES" for row in rows))
          print("raw Crossref metadata JSON files:", len(list(Path("phase5/reports/crossref_raw").glob("*.json"))))
          PY

      - name: Commit generated R3a Crossref evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase5/reports/crossref_raw \
            phase5/reports/CROSSREF_VERIFY.csv \
            phase5/reports/CROSSREF_REQUEST_LOG.csv \
            phase5/reports/R3A_VERIFIED_REFERENCES.bib \
            phase5/reports/CROSSREF_METHOD.md
          if git diff --cached --quiet; then
            echo "R3a Crossref evidence is unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "Record R3a Crossref verification evidence"
          git push origin "HEAD:${GITHUB_REF_NAME}"
