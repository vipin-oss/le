name: LaTeX Build

on:
  push:
    branches: [arena/40393d9f-le]
  pull_request:
    branches: [arena/40393d9f-le]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Fixed timestamp -> byte-reproducible PDF -> no push loop
      SOURCE_DATE_EPOCH: '1700000000'
      FORCE_SOURCE_DATE: '1'
    defaults:
      run:
        working-directory: phase4/manuscript

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install TeX Live
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-full texlive-latex-extra \
            texlive-fonts-extra texlive-bibtex-extra biber latexmk inkscape

      - name: Convert SVG figures to PDF
        run: |
          for f in ../figures/source/*.svg; do
            inkscape "$f" --export-type=pdf --export-filename="${f%.svg}.pdf" 2>/dev/null || true
          done
          for f in figures/source/*.svg; do
            inkscape "$f" --export-type=pdf --export-filename="${f%.svg}.pdf" 2>/dev/null || true
          done
          ls -la ../figures/source/*.pdf figures/source/*.pdf 2>/dev/null || echo "No PDFs generated"

      - name: Verify bibliography sources are in sync
        run: |
          if ! diff -q ../references/library.bib references_local.bib; then
            echo "::error::references_local.bib is out of sync with phase4/references/library.bib"
            diff ../references/library.bib references_local.bib | head -40
            exit 1
          fi
          echo "references_local.bib matches phase4/references/library.bib"

      - name: Minimal LaTeX test
        run: |
          echo "\documentclass{article}\begin{document}Hello\end{document}" > test_minimal.tex
          latexmk -pdf -interaction=nonstopmode test_minimal.tex 2>&1 | tail -5 || true
          if [ -f test_minimal.pdf ]; then echo "MINIMAL TEST PASSED"; else echo "MINIMAL TEST FAILED"; fi

      - name: Compile LaTeX manuscript (first pass)
        run: |
          latexmk -pdf -interaction=nonstopmode main.tex 2>&1 | tee first_pass.log
          echo "=== Error lines from first pass ==="
          grep -i "^! \|Error\|undefined\|Missing" first_pass.log | head -30 || true
          echo "=== Log tail ==="
          tail -50 first_pass.log || true

      - name: Run BibTeX
        run: bibtex main || true

      - name: Compile LaTeX manuscript (second pass)
        run: latexmk -pdf -interaction=nonstopmode main.tex 2>&1 | tee second_pass.log || true

      - name: Compile LaTeX manuscript (third pass)
        run: latexmk -pdf -interaction=nonstopmode main.tex 2>&1 | tee third_pass.log || true

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-pdf
          path: phase4/manuscript/main.pdf
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload log files
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            phase4/manuscript/main.log
            phase4/manuscript/main.blg
            phase4/manuscript/first_pass.log
            phase4/manuscript/second_pass.log
            phase4/manuscript/third_pass.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Check for undefined references
        run: |
          if grep -q "Undefined control sequence" main.log; then
            echo "ERROR: Undefined control sequences found"
            grep "Undefined control sequence" main.log | head -20
          fi
          if grep -q "Undefined reference" main.log; then
            echo "ERROR: Undefined references found"
            grep "Undefined reference" main.log | head -20
          fi
          echo "Check complete"

      - name: Check for missing references
        run: |
          FAIL=0
          if grep -q "Reference.*undefined" main.blg 2>/dev/null; then
            echo "ERROR: Missing bibliography references detected"
            grep "Reference.*undefined" main.blg | head -20
            FAIL=1
          else
            echo "No missing bibliography references"
          fi
          if grep -qi "I didn't find a database entry" main.blg 2>/dev/null; then
            echo "ERROR: BibTeX could not resolve the following citation keys"
            grep -i "I didn't find a database entry" main.blg | head -20
            FAIL=1
          else
            echo "All citation keys resolved by BibTeX"
          fi
          if grep -q "Citation.*undefined" main.log 2>/dev/null; then
            echo "ERROR: Undefined citations in the compiled document"
            grep "Citation.*undefined" main.log | head -20
            FAIL=1
          else
            echo "No undefined citations in the document"
          fi
          if [ "$FAIL" -ne 0 ]; then
            echo "::error::Bibliography check failed"
            exit 1
          fi

      - name: Publish build diagnostics
        if: >-
          always()
          && github.ref == 'refs/heads/arena/40393d9f-le'
          && github.event_name == 'push'
          && github.actor != 'github-actions[bot]'
        run: |
          cd "$GITHUB_WORKSPACE"
          {
            echo "=== CI run ${{ github.run_id }} (attempt ${{ github.run_attempt }}) ==="
            echo
            echo "--- main.blg : BibTeX log (full) ---"
            if [ -f phase4/manuscript/main.blg ]; then head -120 phase4/manuscript/main.blg; else echo "(main.blg missing)"; fi
            echo
            echo "--- main.blg : grep I didn't find a database entry ---"
            grep -i "didn't find a database entry" phase4/manuscript/main.blg 2>/dev/null | head -40 || echo "(none)"
            echo
            echo "--- main.log : lines containing 'citation' (case-insensitive) ---"
            grep -in "citation" phase4/manuscript/main.log 2>/dev/null | head -40 || echo "(none)"
            echo
            echo "--- main.log : lines containing 'undefined' ---"
            grep -in "undefined" phase4/manuscript/main.log 2>/dev/null | head -40 || echo "(none)"
            echo
            echo "--- main.log : lines containing '!' (errors) ---"
            grep -n "^!" phase4/manuscript/main.log 2>/dev/null | head -40 || echo "(none)"
            echo
            echo "--- main.aux : citation count ---"
            grep -c "\\\\citation" phase4/manuscript/main.aux 2>/dev/null || echo "(no aux)"
            echo "--- main.aux : bibdata ---"
            grep "\\\\bibdata" phase4/manuscript/main.aux 2>/dev/null || echo "(no aux)"
            echo "--- main.aux : bibstyle ---"
            grep "\\\\bibstyle" phase4/manuscript/main.aux 2>/dev/null || echo "(no aux)"
            echo "--- main.aux : bibitem count ---"
            grep -c "\\\\bibitem" phase4/manuscript/main.aux 2>/dev/null || echo "(no aux)"
            echo
            echo "--- main.bbl : bibitem count ---"
            grep -c "\\\\bibitem" phase4/manuscript/main.bbl 2>/dev/null || echo "(no bbl)"
            echo
            echo "--- references_local.bib : entry count ---"
            grep -c "^@" phase4/manuscript/references_local.bib 2>/dev/null || echo "(no bib)"
            echo
            echo "--- distinct citation keys requested in main.aux ---"
            grep "\\\\citation" phase4/manuscript/main.aux 2>/dev/null | sed 's/.*citation{\(.*\)}.*/\1/' | tr ',' '\n' | sed 's/^ *//; s/ *$//' | sort -u || echo "(no aux)"
          } > phase4/manuscript/build_diagnostics.txt 2>&1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.github.com"
          git add phase4/manuscript/build_diagnostics.txt
          if git diff --cached --quiet; then
            echo "Diagnostics unchanged - nothing to publish"
            exit 0
          fi
          git commit -m "chore: publish build diagnostics (run ${{ github.run_id }})"
          git push origin HEAD:refs/heads/arena/40393d9f-le

      - name: Publish compiled PDF back to branch
        if: >-
          github.ref == 'refs/heads/arena/40393d9f-le'
          && github.event_name == 'push'
          && github.actor != 'github-actions[bot]'
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ ! -f phase4/manuscript/main.pdf ]; then
            echo "No PDF produced - skipping publish step"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase4/manuscript/main.pdf
          if git diff --cached --quiet; then
            echo "PDF is byte-identical to the committed one (reproducible build) - nothing to do"
            exit 0
          fi
          PUBLISH_COUNT=$(git log --oneline --fixed-strings --grep="chore: publish compiled manuscript PDF" | wc -l)
          if [ "$PUBLISH_COUNT" -ge 25 ]; then
            echo "::warning::Publish guard reached ($PUBLISH_COUNT prior PDF publications) - skipping"
            exit 0
          fi
          git commit -m "chore: publish compiled manuscript PDF (build ${{ github.run_number }})"
          git push origin HEAD:refs/heads/arena/40393d9f-le
          echo "Published PDF to branch"
