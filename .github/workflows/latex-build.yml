name: Phase5 LaTeX build

on:
  push:
    branches: [arena/40393d9f-le]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase5-build-r2-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_DATE_EPOCH: '1700000000'
      FORCE_SOURCE_DATE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install TeX and PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-science \
            texlive-bibtex-extra \
            texlive-fonts-recommended \
            texlive-pictures \
            fonts-dejavu-core \
            poppler-utils

      - name: Set up Python and audit dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: phase5/tools/requirements-audit.txt

      - name: Install pinned equation-audit dependency
        run: python -m pip install -r phase5/tools/requirements-audit.txt

      - name: Symbolically verify classical flux identity
        run: python phase5/scripts/verify_classical_flux.py

      - name: Install vector-render dependencies
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: phase5/tools/package-lock.json

      - name: Install pinned JavaScript dependencies
        working-directory: phase5/tools
        run: npm ci --ignore-scripts

      - name: Record toolchain
        run: |
          pdflatex --version | head -2
          latexmk -v | head -2
          bibtex --version | head -2
          node --version
          npm --version
          pdfinfo -v 2>&1 | head -1
          git rev-parse HEAD

      - name: Build figures, compile master, and enforce gates
        run: bash phase5/scripts/build_master.sh

      - name: Render PDF text and contact sheets
        if: always()
        run: |
          pdf=phase5/master/build/main.pdf
          if [[ ! -s "$pdf" ]]; then
            echo "No compiled PDF is available for extraction or contact-sheet review."
            exit 0
          fi
          pdftotext -layout "$pdf" phase5/master/build/main.txt
          python phase5/scripts/make_pdf_thumbnails.py "$pdf" phase5/master/build/contact-sheets --dpi 100 --per-sheet 40 --cols 5

      - name: Publish strict-build PDF and contact sheets to the branch
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/arena/40393d9f-le'
        run: |
          set -euo pipefail
          pdf=phase5/master/build/main.pdf
          test -s "$pdf"
          mkdir -p phase5/build_outputs/contact-sheets
          rm -f phase5/build_outputs/contact-sheets/*.png
          cp "$pdf" phase5/build_outputs/phase5-v1.1-master.pdf
          cp phase5/master/build/contact-sheets/*.png phase5/build_outputs/contact-sheets/
          underfull_hboxes=$(python3 - <<'PYCOUNT'
          import re
          from pathlib import Path
          text = Path("phase5/master/build/process.log").read_text(errors="replace")
          values = re.findall(r"underfull hboxes: (\d+)", text)
          print(values[-1] if values else "unavailable")
          PYCOUNT
          )
          underfull_vboxes=$(python3 - <<'PYCOUNT'
          import re
          from pathlib import Path
          text = Path("phase5/master/build/process.log").read_text(errors="replace")
          values = re.findall(r"underfull vboxes: (\d+)", text)
          print(values[-1] if values else "unavailable")
          PYCOUNT
          )
          cat > phase5/build_outputs/README.md <<EOF
          # Phase5 v1.1 strict-build outputs

          These files are generated from the phase5 master manuscript by the strict CI build.
          Run: ${GITHUB_RUN_ID}
          Source commit: ${GITHUB_SHA}
          PDF: phase5-v1.1-master.pdf
          Contact sheets: contact-sheets/*.png (100 dpi, at most 40 pages per sheet)
          Underfull hbox warnings: ${underfull_hboxes}
          Underfull vbox warnings: ${underfull_vboxes}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase5/build_outputs/README.md phase5/build_outputs/phase5-v1.1-master.pdf phase5/build_outputs/contact-sheets/*.png
          if git diff --cached --quiet; then
            echo "Published output files are unchanged."
            exit 0
          fi
          git commit -m "Publish strict-build PDF and contact sheets (${GITHUB_RUN_ID})"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload compiled PDF and build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-v1.1-master-pdf-${{ github.run_id }}
          path: |
            phase5/master/build/main.pdf
            phase5/master/build/pdfinfo.txt
            phase5/master/build/pdffonts.txt
            phase5/master/build/main.txt
            phase5/master/build/contact-sheets/*.png
            phase5/build_outputs/README.md
            phase5/build_outputs/phase5-v1.1-master.pdf
            phase5/build_outputs/contact-sheets/*.png
          if-no-files-found: warn
          retention-days: 30

      - name: Upload complete build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-v1.1-build-logs-${{ github.run_id }}
          path: |
            phase5/master/build/process.log
            phase5/master/build/pass1.log
            phase5/master/build/pass2.log
            phase5/master/build/pass3.log
            phase5/master/build/pass4.log
            phase5/master/build/bibtex.log
            phase5/master/build/main.log
            phase5/master/build/main.blg
            phase5/master/build/main.aux
            phase5/master/build/main.bbl
            phase5/master/build/main.fls
            phase5/master/build/pdfinfo.txt
            phase5/master/build/pdffonts.txt
          if-no-files-found: warn
          retention-days: 30
