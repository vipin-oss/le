              phase5/reports/CROSSREF_R3B_VERIFY.csv \
              phase5/reports/CROSSREF_R3B_REQUEST_LOG.csv \
              phase5/reports/CROSSREF_R3B_METHOD.md \
              phase5/reports/CROSSREF_R3B_HUMAN_CHECK.md \
              phase5/reports/R3B_VERIFIED_REFERENCES.bib \
              phase5/master/references_local.bib \
              phase5/master/sections/sec05_multiphysics.tex \
              phase5/master/sections/sec06_transport.tex \
              phase5/master/sections/sec07_nonlocal.tex \
              phase5/master/sections/sec08_mathematical_methods.tex \
              phase5/master/sections/sec09_interfaces.tex \
              phase5/master/sections/sec11_advanced.tex \
              phase5/master/sections/sec13_applications.tex
          fi
          if [[ -s phase5/reports/CROSSREF_R3C_VERIFY.csv ]]; then
            git add -A phase5/reports/crossref_raw_r3c \
              phase5/reports/CROSSREF_R3C_VERIFY.csv \
              phase5/reports/CROSSREF_R3C_REQUEST_LOG.csv \
              phase5/reports/CROSSREF_R3C_METHOD.md \
              phase5/reports/CROSSREF_R3C_HUMAN_CHECK.md \
              phase5/reports/R3C_VERIFIED_REFERENCES.bib \
              phase5/master/references_local.bib \
              phase5/master/sections/sec04_thermoelastic.tex \
              phase5/master/sections/sec10_energy.tex
          fi
          if [[ -s phase5/reports/CROSSREF_R3D_VERIFY.csv ]]; then
            git add -A phase5/reports/crossref_raw_r3d \
              phase5/reports/CROSSREF_R3D_VERIFY.csv \
              phase5/reports/CROSSREF_R3D_REQUEST_LOG.csv \
              phase5/reports/CROSSREF_R3D_METHOD.md \
              phase5/reports/CROSSREF_R3D_HUMAN_CHECK.md \
              phase5/reports/R3D_VERIFIED_REFERENCES.bib \
              phase5/master/references_local.bib \
              phase5/master/sections/sec04_thermoelastic.tex \
              phase5/master/sections/sec05_multiphysics.tex \
              phase5/master/sections/sec11_advanced.tex \
              phase5/master/sections/sec12_comparative.tex
          fi
          if [[ -s phase5/reports/CROSSREF_R3E_VERIFY.csv ]]; then
            git add -A phase5/reports/crossref_raw_r3e \
              phase5/reports/CROSSREF_R3E_VERIFY.csv \
              phase5/reports/CROSSREF_R3E_REQUEST_LOG.csv \
              phase5/reports/CROSSREF_R3E_METHOD.md \
              phase5/reports/CROSSREF_R3E_HUMAN_CHECK.md \
              phase5/reports/R3E_VERIFIED_REFERENCES.bib \
              phase5/master/references_local.bib \
              phase5/master/sections/sec08_mathematical_methods.tex
          fi
          if [[ -s phase5/reports/CROSSREF_R3F_VERIFY.csv ]]; then
            git add -A phase5/reports/crossref_raw_r3f \
              phase5/reports/CROSSREF_R3F_VERIFY.csv \
              phase5/reports/CROSSREF_R3F_REQUEST_LOG.csv \
              phase5/reports/CROSSREF_R3F_METHOD.md \
              phase5/reports/CROSSREF_R3F_HUMAN_CHECK.md \
              phase5/reports/R3F_VERIFIED_REFERENCES.bib \
              phase5/reports/R3F_SECTION_COUNTS.csv \
              phase5/master/references_local.bib \
              phase5/master/sections/sec02_literature.tex \
              phase5/master/sections/sec04_thermoelastic.tex \
              phase5/master/sections/sec05_multiphysics.tex \
              phase5/master/sections/sec08_mathematical_methods.tex \
              phase5/master/sections/sec10_energy.tex \
              phase5/master/sections/sec11_advanced.tex \
              phase5/master/sections/sec12_comparative.tex
          fi
          if [[ -f phase5/reports/R3_STATUS.md ]]; then
            git add phase5/reports/R3_STATUS.md
          fi
          if git diff --cached --quiet; then
            echo "Published output files are unchanged."
            exit 0
          fi
          git commit -m "Publish strict-build PDF and contact sheets (${GITHUB_RUN_ID})"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload compiled PDF and build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-v1.1-master-pdf-${{ github.run_id }}
          path: |
            phase5/master/build/main.pdf
            phase5/master/build/pdfinfo.txt
            phase5/master/build/pdffonts.txt
            phase5/master/build/main.txt
            phase5/master/build/contact-sheets/*.png
            phase5/build_outputs/README.md
            phase5/build_outputs/phase5-v1.1-master.pdf
