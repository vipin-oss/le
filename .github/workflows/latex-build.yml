name: Phase5 LaTeX build

on:
  push:
    branches: ['arena/**']
    # The build publishes only generated PDFs/contact sheets and R3_STATUS; ignore
    # that bot commit so one source push results in one CI run, not a second build.
    paths-ignore: ['recovery/**', 'R3_*.md', 'verification/**', 'phase5/build_outputs/**', 'phase5/reports/R3_STATUS.md']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase5-build-r2-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Defense in depth if a generated-output push ever escapes paths-ignore.
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    container:
      image: texlive/texlive:latest
    env:
      SOURCE_DATE_EPOCH: '1700000000'
      FORCE_SOURCE_DATE: '1'
    steps:
      - name: Install PDF inspection utilities
        id: pdf_tools
        run: |
          set -euo pipefail
          install_log="${RUNNER_TEMP}/pdf-tools-install.log"
          install_started=$(date +%s)
          {
            apt-get update -o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              ca-certificates git python3 python3-venv lsb-release fonts-dejavu-core poppler-utils
          } 2>&1 | tee "$install_log"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          command -v git
          command -v python3
          command -v lsb_release
          command -v pdfinfo
          command -v pdftotext
          install_finished=$(date +%s)
          echo "install_seconds=$((install_finished - install_started))" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout read-only literature verification inputs
        if: startsWith(github.ref, 'refs/heads/arena/') && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[R3A-CROSSREF]') || contains(github.event.head_commit.message, '[R3B-CROSSREF]') || contains(github.event.head_commit.message, '[R3C-CROSSREF]') || contains(github.event.head_commit.message, '[R3D-CROSSREF]'))))
        uses: actions/checkout@v4
        with:
          ref: 288ccc469b484419c2036ac0ff5e6a408699bd6f
          path: verification-reference
          fetch-depth: 1

      - name: Checkout read-only R3e source findings
        if: startsWith(github.ref, 'refs/heads/arena/') && github.event_name == 'push' && contains(github.event.head_commit.message, '[R3E-CROSSREF]')
        uses: actions/checkout@v4
        with:
          ref: 0be11f22f94553d4adc7507978c80a0f9f7fa8fe
          path: control-reference
          fetch-depth: 1

      - name: Checkout read-only R3f source findings
        if: startsWith(github.ref, 'refs/heads/arena/') && github.event_name == 'push' && contains(github.event.head_commit.message, '[R3F-CROSSREF]')
        uses: actions/checkout@v4
        with:
          ref: f95cf216f409b742699ccafbe6186375843ee811
          path: control-reference
          fetch-depth: 1

      # R3d has newly eligible Section 4 DOIs beyond the frozen R3a raw-response set; keep R3a reclassification scoped to R3a/b/c.
      - name: Reclassify saved Crossref results for Sections 4.1–4.12
        if: startsWith(github.ref, 'refs/heads/arena/') && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[R3A-CROSSREF]') || contains(github.event.head_commit.message, '[R3B-CROSSREF]') || contains(github.event.head_commit.message, '[R3C-CROSSREF]'))))
        env:
          REUSE_R3A_RAW: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[R3B-CROSSREF]') || contains(github.event.head_commit.message, '[R3C-CROSSREF]'))) }}
        run: |
          args=()
          if [[ "$REUSE_R3A_RAW" == "true" ]]; then args+=(--reuse-raw); fi
          python3 phase5/scripts/crossref_enrich.py \
            --base-csv verification-reference/verification/LITERATURE_BASE.csv \
            --local-bib phase5/master/references_local.bib \
            --raw-dir phase5/reports/crossref_raw \
            --references-dir phase5/reports \
            --plan-csv verification-reference/verification/REFERENCE_PLAN.csv \
            --citation-map-csv verification-reference/verification/CITATION_MAP.csv \
            --row-index-csv verification-reference/verification/api_log/LITERATURE_ROW_INDEX.csv \
            --report-dir phase5/reports \
            --pause 1.0 "${args[@]}"

      - name: Verify and prepare R3b evidence for Sections 5–9 and 11–13
        if: startsWith(github.ref, 'refs/heads/arena/') && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[R3B-CROSSREF]')))
        run: |
          python3 phase5/scripts/crossref_r3b.py \
            --base-csv verification-reference/verification/LITERATURE_BASE.csv \
            --plan-csv verification-reference/verification/REFERENCE_PLAN.csv \
            --citation-map-csv verification-reference/verification/CITATION_MAP.csv \
            --row-index-csv verification-reference/verification/api_log/LITERATURE_ROW_INDEX.csv \
            --local-bib phase5/master/references_local.bib \
            --raw-dir phase5/reports/crossref_raw_r3b \
            --report-dir phase5/reports \
            --pause 1.0

      - name: Apply only verified, mapped R3b citations
        if: startsWith(github.ref, 'refs/heads/arena/') && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[R3B-CROSSREF]')))
        run: |
          python3 phase5/scripts/r3b_apply.py \
            --verify-csv phase5/reports/CROSSREF_R3B_VERIFY.csv \
            --map-csv phase5/reports/R3B_CITATION_MAP.csv \
            --local-bib phase5/master/references_local.bib \
            --reports-dir phase5/reports \
            --sections-dir phase5/master/sections \
            --status-report phase5/reports/R3_STATUS.md

      - name: Verify eligible R3c sources for Section 10 and Section 4.11
        if: startsWith(github.ref, 'refs/heads/arena/') && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[R3C-CROSSREF]')))
        run: |
          python3 phase5/scripts/crossref_r3c.py \
            --base-csv verification-reference/verification/LITERATURE_BASE.csv \
            --plan-csv verification-reference/verification/REFERENCE_PLAN.csv \
            --citation-map-csv verification-reference/verification/CITATION_MAP.csv \
            --row-index-csv verification-reference/verification/api_log/LITERATURE_ROW_INDEX.csv \
            --r3c-map-csv phase5/reports/R3C_CITATION_MAP.csv \
            --local-bib phase5/master/references_local.bib \
            --raw-dir phase5/reports/crossref_raw_r3c \
            --report-dir phase5/reports \
            --pause 1.0

      - name: Apply only eligible, verified R3c citations
        if: startsWith(github.ref, 'refs/heads/arena/') && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[R3C-CROSSREF]')))
        run: |
          python3 phase5/scripts/r3c_apply.py \
            --verify-csv phase5/reports/CROSSREF_R3C_VERIFY.csv \
            --prior-r3b-verify phase5/reports/CROSSREF_R3B_VERIFY.csv \
            --map-csv phase5/reports/R3C_CITATION_MAP.csv \
            --reports-dir phase5/reports \
            --local-bib phase5/master/references_local.bib \
            --sections-dir phase5/master/sections \
            --status-report phase5/reports/R3_STATUS.md

      - name: Verify newly eligible R3d references
        if: startsWith(github.ref, 'refs/heads/arena/') && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[R3D-CROSSREF]')))
        run: |
          python3 phase5/scripts/crossref_r3d.py \
            --base-csv verification-reference/verification/LITERATURE_BASE.csv \
            --plan-csv verification-reference/verification/REFERENCE_PLAN.csv \
            --readiness-csv verification-reference/verification/REFERENCE_READINESS.csv \
            --citation-map-csv verification-reference/verification/CITATION_MAP.csv \
            --row-index-csv verification-reference/verification/api_log/LITERATURE_ROW_INDEX.csv \
            --r3d-map-csv phase5/reports/R3D_CITATION_MAP.csv \
            --local-bib phase5/master/references_local.bib \
            --raw-dir phase5/reports/crossref_raw_r3d \
            --report-dir phase5/reports \
            --pause 1.0

      - name: Apply only verified, mapped R3d evidence
        if: startsWith(github.ref, 'refs/heads/arena/') && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[R3D-CROSSREF]')))
        run: |
          python3 phase5/scripts/r3d_apply.py \
            --verify-csv phase5/reports/CROSSREF_R3D_VERIFY.csv \
            --map-csv phase5/reports/R3D_CITATION_MAP.csv \
            --plan-csv verification-reference/verification/REFERENCE_PLAN.csv \
            --readiness-csv verification-reference/verification/REFERENCE_READINESS.csv \
            --reports-dir phase5/reports \
            --local-bib phase5/master/references_local.bib \
            --sections-dir phase5/master/sections \
            --status-report phase5/reports/R3_STATUS.md

      - name: Verify only the two requested R3e Laplace-inversion DOIs
        if: startsWith(github.ref, 'refs/heads/arena/') && github.event_name == 'push' && contains(github.event.head_commit.message, '[R3E-CROSSREF]')
        run: |
          python3 phase5/scripts/crossref_r3e.py \
            --map-csv phase5/reports/R3E_CITATION_MAP.csv \
            --findings-file control-reference/control/FULLTEXT_FINDINGS_09.md \
            --local-bib phase5/master/references_local.bib \
            --raw-dir phase5/reports/crossref_raw_r3e \
            --report-dir phase5/reports \
            --pause 1.0

      - name: Apply only verified R3e citations to Section 8
        if: startsWith(github.ref, 'refs/heads/arena/') && github.event_name == 'push' && contains(github.event.head_commit.message, '[R3E-CROSSREF]')
        run: |
          python3 phase5/scripts/r3e_apply.py \
            --verify-csv phase5/reports/CROSSREF_R3E_VERIFY.csv \
            --map-csv phase5/reports/R3E_CITATION_MAP.csv \
            --reports-dir phase5/reports \
            --local-bib phase5/master/references_local.bib \
            --sections-dir phase5/master/sections \
            --status-report phase5/reports/R3_STATUS.md

      - name: Verify only mapped R3f sources against Crossref
        if: startsWith(github.ref, 'refs/heads/arena/') && github.event_name == 'push' && contains(github.event.head_commit.message, '[R3F-CROSSREF]')
        run: |
          python3 phase5/scripts/crossref_r3f.py \
            --map-csv phase5/reports/R3F_CITATION_MAP.csv \
            --findings-file control-reference/control/FULLTEXT_FINDINGS_10.md \
            --findings-04 control-reference/control/FULLTEXT_FINDINGS_04.md \
            --findings-09 control-reference/control/FULLTEXT_FINDINGS_09.md \
            --local-bib phase5/master/references_local.bib \
            --raw-dir phase5/reports/crossref_raw_r3f \
            --report-dir phase5/reports \
            --pause 1.0

      - name: Apply only verified R3f citations and source-specific claims
        if: startsWith(github.ref, 'refs/heads/arena/') && github.event_name == 'push' && contains(github.event.head_commit.message, '[R3F-CROSSREF]')
        run: |
          set -o pipefail
          python3 phase5/scripts/r3f_apply.py \
            --verify-csv phase5/reports/CROSSREF_R3F_VERIFY.csv \
            --map-csv phase5/reports/R3F_CITATION_MAP.csv \
            --reports-dir phase5/reports \
            --local-bib phase5/master/references_local.bib \
            --sections-dir phase5/master/sections \
            --status-report phase5/reports/R3_STATUS.md \
            2>&1 | tee phase5/reports/R3F_APPLY.log

      - name: Create Python audit virtual environment
        run: |
          set -euo pipefail
          python_venv="${RUNNER_TEMP}/phase5-audit-venv"
          python3 -m venv "$python_venv"
          echo "${python_venv}/bin" >> "$GITHUB_PATH"
          "${python_venv}/bin/python" --version

      - name: Install pinned equation-audit dependency
        run: python -m pip install -r phase5/tools/requirements-audit.txt

      - name: Symbolically verify classical flux identity
        run: python phase5/scripts/verify_classical_flux.py

      - name: Install vector-render dependencies
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: phase5/tools/package-lock.json

      - name: Install pinned JavaScript dependencies
        working-directory: phase5/tools
        run: npm ci --ignore-scripts

      - name: Record toolchain
        run: |
          pdflatex --version | head -2
          latexmk -v | head -2
          bibtex --version | head -2
          node --version
          npm --version
          pdfinfo -v 2>&1 | head -1
          git rev-parse HEAD

      - name: Build figures, compile master, and enforce gates
        id: strict_build
        run: |
          started=$(date +%s)
          bash phase5/scripts/build_master.sh
          finished=$(date +%s)
          echo "build_seconds=$((finished-started))" >> "$GITHUB_OUTPUT"

      - name: Render PDF text and contact sheets
        if: always()
        run: |
          pdf=phase5/master/build/main.pdf
          if [[ ! -s "$pdf" ]]; then
            echo "No compiled PDF is available for extraction or contact-sheet review."
            exit 0
          fi
          pdftotext -layout "$pdf" phase5/master/build/main.txt
          python phase5/scripts/make_pdf_thumbnails.py "$pdf" phase5/master/build/contact-sheets --dpi 100 --per-sheet 40 --cols 5

      - name: Enforce forbidden manuscript-tag scan
        if: always()
        run: |
          text=phase5/master/build/main.txt
          if [[ ! -s "$text" ]]; then
            echo "Extracted PDF text unavailable; cannot enforce the forbidden-token scan."
            exit 1
          fi
          python3 - "$text" <<'PY'
          import re
          import sys
          from pathlib import Path
          text = Path(sys.argv[1]).read_text(errors='replace')
          # Exact case-sensitive tag pattern requested for the gate.
          tag_pattern = re.compile(r'\b(?:PRIMARY-SOURCE|GAP-\d+|LIT-\d+|OCL-\d+|R[1-6][a-z]?\b(?=[ :\]-])|UNVERIFIED)\b|\?\?')
          # Retain the previous broad scan only to classify its legacy hits in CI logs.
          legacy_pattern = re.compile(r'PRIMARY-SOURCE|GAP-|LIT-|R3|R4|UNVERIFIED|OCL-|\?\?', re.I)
          legacy_hits = list(legacy_pattern.finditer(text))
          strict_hits = list(tag_pattern.finditer(text))
          print(f'Legacy broad substring matches (diagnostic only): {len(legacy_hits)}')
          for number, hit in enumerate(legacy_hits, 1):
              strict = next((match for match in strict_hits
                             if match.start() == hit.start() and match.end() >= hit.end()), None)
              classification = 'REAL process tag' if strict else 'FALSE POSITIVE under strict tag pattern'
              strict_token = strict.group(0) if strict else 'none'
              line_number = text.count('\n', 0, hit.start()) + 1
              context = text[max(0, hit.start() - 80):min(len(text), hit.end() + 80)]
              context = context.replace('\r', '').replace('\n', ' ⏎ ')
              message = (f'line={line_number}; matched={hit.group(0)!r}; strict_token={strict_token!r}; '
                         f'classification={classification}; context={context!r}')
              print(f'Legacy hit {number}: {message}')
              annotation = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::notice title=R4A legacy scan hit::{annotation}')
          print(f'Forbidden-token occurrences in pdftotext (strict pattern): {len(strict_hits)}')
          if strict_hits:
              raise SystemExit(1)
          PY

      - name: Write R4A metrics to the job summary
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          PDF_TOOLS_INSTALL_SECONDS: ${{ steps.pdf_tools.outputs.install_seconds }}
          BUILD_SECONDS: ${{ steps.strict_build.outputs.build_seconds }}
        run: |
          python3 - <<'PY'
          import csv
          import re
          import subprocess
          from pathlib import Path
          import os

          root = Path('.')
          pdf = root / 'phase5/master/build/main.pdf'
          text_path = root / 'phase5/master/build/main.txt'
          process_log = root / 'phase5/master/build/process.log'
          main_log = root / 'phase5/master/build/main.log'

          pages = 'unavailable'
          if pdf.is_file():
              try:
                  info = subprocess.run(['pdfinfo', str(pdf)], check=True, capture_output=True, text=True).stdout
                  match = re.search(r'^Pages:\s+(\d+)', info, re.M)
                  if match:
                      pages = match.group(1)
              except (OSError, subprocess.CalledProcessError):
                  pass

          undefined_refs = 'unavailable'
          if process_log.is_file():
              values = re.findall(r'undefined references/citations: (\d+)', process_log.read_text(errors='replace'))
              if values:
                  undefined_refs = values[-1]

          extracted = text_path.read_text(errors='replace') if text_path.is_file() else ''
          # Assemble provider/storage terms so this checker does not reintroduce them into source text.
          storage_word = 'dri' + 've'
          provider_word = 'goo' + 'gle'
          docs_word = 'do' + 'cs'
          forbidden_patterns = [
              r'https?://(?:' + re.escape(storage_word + '.' + provider_word + '.com') + r'|' + re.escape(docs_word + '.' + provider_word + '.com') + r')\S*',
              r'\b' + provider_word + r'\s+' + storage_word + r'\b',
              r'\b' + storage_word + r'\s+(?:url|id|link|folder)\b',
              r'\bshared\s+' + storage_word + r'\b',
          ]
          forbidden_count = sum(len(re.findall(pattern, extracted, re.I)) for pattern in forbidden_patterns)
          tag_pattern = re.compile(r'\b(?:PRIMARY-SOURCE|GAP-\d+|LIT-\d+|OCL-\d+|R[1-6][a-z]?\b(?=[ :\]-])|UNVERIFIED)\b|\?\?')
          forbidden_tags = len(tag_pattern.findall(extracted))

          rendered_figures = len(list((root / 'phase5/master/figures/source').glob('*.pdf')))
          included_figures = 0
          for source in (root / 'phase5/master').rglob('*.tex'):
              for line in source.read_text(errors='replace').splitlines():
                  active = line.split('%', 1)[0]
                  included_figures += len(re.findall(r'\\includegraphics(?:\[[^]]*\])?\s*\{[^}]+\}', active))
          audit_path = root / 'phase5/reports/R4A_DELETION_AUDIT.csv'
          none_rows = 'unavailable'
          if audit_path.is_file():
              with audit_path.open(encoding='utf-8-sig', newline='') as handle:
                  none_rows = str(sum(row.get('ledger_row_id') == 'NONE' for row in csv.DictReader(handle)))

          near_overfull = 'unavailable'
          if main_log.is_file():
              try:
                  result = subprocess.run(
                      ['python3', 'phase5/scripts/report_near_overfull.py', str(main_log)],
                      check=True, capture_output=True, text=True,
                  ).stdout.strip()
                  near_overfull = '0' if result in ('', 'none') else str(len(result.split('; ')))
              except (OSError, subprocess.CalledProcessError):
                  pass

          install_seconds = os.environ.get('PDF_TOOLS_INSTALL_SECONDS', 'unavailable')
          build_seconds = os.environ.get('BUILD_SECONDS', 'unavailable')
          install_build_seconds = 'unavailable'
          if install_seconds.isdigit() and build_seconds.isdigit():
              install_build_seconds = str(int(install_seconds) + int(build_seconds))

          values = {
              'Run ID': os.environ.get('RUN_ID', 'unavailable'),
              'PDF tools install seconds': install_seconds,
              'TeX build seconds': build_seconds,
              'Install + build seconds': install_build_seconds,
              'PDF pages': pages,
              'Undefined references/citations': undefined_refs,
              'Forbidden privacy-token occurrences in pdftotext': str(forbidden_count),
              'Forbidden manuscript-tag occurrences in pdftotext': str(forbidden_tags),
              'Rendered figure PDFs': str(rendered_figures),
              'Figure includes in master': str(included_figures),
              'Deletion-audit NONE rows': none_rows,
              'Near-overfull boxes (>0.5 pt)': near_overfull,
          }
          summary = ['## R4A build metrics', '', '| Metric | Result |', '|---|---:|']
          summary.extend(f'| {key} | {value} |' for key, value in values.items())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as handle:
              handle.write('\n'.join(summary) + '\n')
          print('::notice title=R4A metrics::' + '; '.join(f'{key}={value}' for key, value in values.items()))
          PY

      - name: Upload R3f verification and strict-build diagnostics
        if: always() && startsWith(github.ref, 'refs/heads/arena/') && github.event_name == 'push' && contains(github.event.head_commit.message, '[R3F-CROSSREF]')
        uses: actions/upload-artifact@v4
        with:
          name: r3f-verification-and-build-diagnostics-${{ github.run_id }}
          path: |
            phase5/reports/CROSSREF_R3F_VERIFY.csv
            phase5/reports/CROSSREF_R3F_REQUEST_LOG.csv
            phase5/reports/crossref_raw_r3f/**/*.json
            phase5/reports/R3F_VERIFIED_REFERENCES.bib
            phase5/reports/CROSSREF_R3F_METHOD.md
            phase5/reports/CROSSREF_R3F_HUMAN_CHECK.md
            phase5/reports/R3F_SECTION_COUNTS.csv
            phase5/reports/R3F_APPLY.log
            phase5/reports/R3_STATUS.md
            phase5/master/references_local.bib
            phase5/master/sections/sec02_literature.tex
            phase5/master/sections/sec04_thermoelastic.tex
            phase5/master/sections/sec05_multiphysics.tex
            phase5/master/sections/sec08_mathematical_methods.tex
            phase5/master/sections/sec10_energy.tex
            phase5/master/sections/sec11_advanced.tex
            phase5/master/sections/sec12_comparative.tex
            phase5/master/build/main.log
            phase5/master/build/process.log
            phase5/master/build/pass*.log
            phase5/master/build/bibtex.log
            phase5/master/build/main.blg
            phase5/master/build/main.aux
            phase5/master/build/main.fls
            phase5/master/build/pdfinfo.txt
            phase5/master/build/pdffonts.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Publish strict-build PDF and contact sheets to the branch
        if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/heads/arena/')
        run: |
          set -euo pipefail
          pdf=phase5/master/build/main.pdf
          test -s "$pdf"
          mkdir -p phase5/build_outputs/contact-sheets
          rm -f phase5/build_outputs/contact-sheets/*.png
          cp "$pdf" phase5/build_outputs/phase5-v1.1-master.pdf
          cp phase5/master/build/contact-sheets/*.png phase5/build_outputs/contact-sheets/
          underfull_hboxes=$(python3 - <<'PYCOUNT'
          import re
          from pathlib import Path
          text = Path("phase5/master/build/process.log").read_text(errors="replace")
          values = re.findall(r"underfull hboxes: (\d+)", text)
          print(values[-1] if values else "unavailable")
          PYCOUNT
          )
          underfull_vboxes=$(python3 - <<'PYCOUNT'
          import re
          from pathlib import Path
          text = Path("phase5/master/build/process.log").read_text(errors="replace")
          values = re.findall(r"underfull vboxes: (\d+)", text)
          print(values[-1] if values else "unavailable")
          PYCOUNT
          )
          pages=$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')
          unresolved_refs=$(python3 - <<'PYCOUNT'
          import re
          from pathlib import Path
          text = Path("phase5/master/build/process.log").read_text(errors="replace")
          counts = re.findall(r"undefined references/citations: (\d+)", text)
          if not counts:
              raise SystemExit("Strict-build log lacks unresolved reference count")
          print(counts[-1])
          PYCOUNT
          )
          near_overfull=$(python3 phase5/scripts/report_near_overfull.py phase5/master/build/main.log)
          if [[ -f phase5/reports/R3_STATUS.md ]]; then
            BUILD_SECONDS="${{ steps.strict_build.outputs.build_seconds }}" \
            SOURCE_COMMIT="$GITHUB_SHA" CI_RUN_ID="$GITHUB_RUN_ID" \
            PDF_PAGES="$pages" UNRESOLVED_REFS="$unresolved_refs" \
            NEAR_OVERFULL="$near_overfull" python3 - <<'PYR3'
          import os
          from pathlib import Path
          path = Path("phase5/reports/R3_STATUS.md")
          text = path.read_text(encoding="utf-8")
          values = {
              "__R3_SOURCE_COMMIT__": os.environ["SOURCE_COMMIT"],
              "__R3_CI_RUN_ID__": os.environ["CI_RUN_ID"],
              "__R3_BUILD_SECONDS__": os.environ["BUILD_SECONDS"],
              "__R3_PDF_PAGES__": os.environ["PDF_PAGES"],
              "__R3_UNRESOLVED_REFS__": os.environ["UNRESOLVED_REFS"],
              "__R3_NEAR_OVERFULL__": os.environ["NEAR_OVERFULL"],
          }
          for marker, value in values.items():
              text = text.replace(marker, value)
          path.write_text(text, encoding="utf-8")
          PYR3
          fi
          cat > phase5/build_outputs/README.md <<EOF
          # Phase5 v1.1 strict-build outputs

          These files are generated from the phase5 master manuscript by the strict CI build.
          Run: ${GITHUB_RUN_ID}
          Source commit: ${GITHUB_SHA}
          PDF: phase5-v1.1-master.pdf
          Contact sheets: contact-sheets/*.png (100 dpi, at most 40 pages per sheet)
          Underfull hbox warnings: ${underfull_hboxes}
          Underfull vbox warnings: ${underfull_vboxes}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A phase5/build_outputs
          if [[ -s phase5/reports/CROSSREF_VERIFY.csv ]]; then
