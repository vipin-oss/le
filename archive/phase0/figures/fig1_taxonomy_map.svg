<?xml version="1.0" encoding="UTF-8"?>
<!-- Figure 1. Five-axis domain taxonomy. Original synthesis diagram (not copied from any source). -->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620">
  <defs>
    <style>
      .axis {font:700 13px 'DejaVu Sans', sans-serif; fill:#1a3a5c;}
      .level  {font:11px 'DejaVu Sans', sans-serif; fill:#333;}
      .levelTitle {font:700 12px 'DejaVu Sans', sans-serif; fill:#1a3a5c;}
      .box {fill:#eef3f8; stroke:#4a7c9f; stroke-width:1.2; rx:4; ry:4;}
      .centerBox {fill:#dbe7f2; stroke:#1a3a5c; stroke-width:1.6; rx:6; ry:6;}
      .connector {stroke:#8fa8bd; stroke-width:1.2; stroke-dasharray:4,3;}
      .title {font:700 15px 'DejaVu Sans', sans-serif; fill:#1a3a5c;}
      .subtitle {font:11px 'DejaVu Sans', sans-serif; fill:#555;}
    </style>
  </defs>
  <rect x="0" y="0" width="900" height="620" fill="white"/>
  <text x="450" y="30" class="title" text-anchor="middle">Five-axis taxonomy — the researcher's programme as (A–E) tuples</text>
  <text x="450" y="48" class="subtitle" text-anchor="middle">Each paper decomposes as one level per axis; the review topics are slices of this space</text>

  <!-- Center: research programme -->
  <rect x="365" y="210" width="170" height="90" class="centerBox"/>
  <text x="450" y="232" class="axis" text-anchor="middle">Wave propagation in</text>
  <text x="450" y="250" class="axis" text-anchor="middle">multiphysics continua</text>
  <text x="450" y="268" class="level" text-anchor="middle">generalized thermoelastic • piezo-thermoelastic •</text>
  <text x="450" y="282" class="level" text-anchor="middle">porous • memory-dependent • nonlocal</text>

  <!-- Axis A: Thermal law -->
  <rect x="60" y="70" width="150" height="26" class="box"/>
  <text x="135" y="87" class="levelTitle" text-anchor="middle">A · Thermal law</text>
  <text x="135" y="112" class="level" text-anchor="middle">Fourier</text>
  <text x="135" y="128" class="level" text-anchor="middle">Lord–Shulman</text>
  <text x="135" y="144" class="level" text-anchor="middle">Green–Lindsay</text>
  <text x="135" y="160" class="level" text-anchor="middle">Green–Naghdi II/III</text>
  <text x="135" y="176" class="level" text-anchor="middle">Dual-phase-lag</text>
  <text x="135" y="192" class="level" text-anchor="middle">Three-phase-lag</text>
  <text x="135" y="208" class="level" text-anchor="middle">Moore–Gibson–Thompson</text>
  <text x="135" y="224" class="level" text-anchor="middle">Memory-dependent deriv.</text>
  <text x="135" y="240" class="level" text-anchor="middle">Fractional-order</text>
  <line x1="185" y="170" x2="365" y2="255" class="connector"/>

  <!-- Axis B: Coupling field -->
  <rect x="620" y="70" width="220" height="26" class="box"/>
  <text x="730" y="87" class="levelTitle" text-anchor="middle">B · Coupling field</text>
  <text x="730" y="112" class="level" text-anchor="middle">Purely elastic</text>
  <text x="730" y="128" class="level" text-anchor="middle">Thermoelastic</text>
  <text x="730" y="144" class="level" text-anchor="middle">Piezoelectric / piezothermoelastic</text>
  <text x="730" y="160" class="level" text-anchor="middle">Piezomagnetic / flexomagnetic</text>
  <text x="730" y="176" class="level" text-anchor="middle">Photo-thermo-piezo-elastic</text>
  <text x="730" y="192" class="level" text-anchor="middle">Photo-piezoelectric-semiconductor</text>
  <text x="730" y="208" class="level" text-anchor="middle">Magneto-thermo-elastic</text>
  <line x1="670" y="170" x2="450" y2="255" class="connector"/>

  <!-- Axis C: Pore structure -->
  <rect x="60" y="300" width="180" height="26" class="box"/>
  <text x="150" y="317" class="levelTitle" text-anchor="middle">C · Pore structure</text>
  <text x="150" y="342" class="level" text-anchor="middle">Solid (no pores)</text>
  <text x="150" y="358" class="level" text-anchor="middle">Voids (single porosity)</text>
  <text x="150" y="374" class="level" text-anchor="middle">Double porosity</text>
  <text x="150" y="390" class="level" text-anchor="middle">Saturated, inviscid liquid</text>
  <text x="150" y="406" class="level" text-anchor="middle">Micropolar</text>
  <line x1="205" y="370" x2="365" y2="305" class="connector"/>

  <!-- Axis D: Scale / size -->
  <rect x="300" y="470" width="170" height="26" class="box"/>
  <text x="385" y="487" class="levelTitle" text-anchor="middle">D · Scale / size</text>
  <text x="385" y="512" class="level" text-anchor="middle">Local continuum</text>
  <text x="385" y="528" class="level" text-anchor="middle">Nonlocal (Eringen)</text>
  <text x="385" y="544" class="level" text-anchor="middle">Size-dependent</text>
  <text x="385" y="560" class="level" text-anchor="middle">Microstructured</text>
  <text x="385" y="576" class="level" text-anchor="middle">Nanobeam / microplate</text>
  <line x1="340" y="515" x2="365" y2="305" class="connector"/>

  <!-- Axis E: Geometry / boundary -->
  <rect x="560" y="300" width="280" height="26" class="box"/>
  <text x="700" y="317" class="levelTitle" text-anchor="middle">E · Geometry / boundary</text>
  <text x="700" y="342" class="level" text-anchor="middle">Half-space</text>
  <text x="700" y="358" class="level" text-anchor="middle">Interface: two half-spaces</text>
  <text x="700" y="374" class="level" text-anchor="middle">Free surface (Rayleigh)</text>
  <text x="700" y="390" class="level" text-anchor="middle">Layered waveguide</text>
  <text x="700" y="406" class="level" text-anchor="middle">Slab between two media</text>
  <text x="700" y="422" class="level" text-anchor="middle">Beam / plate / microplate</text>
  <text x="700" y="438" class="level" text-anchor="middle">Cylindrical tunnel / spherical cavity</text>
  <text x="700" y="454" class="level" text-anchor="middle">Parabolic interfacial discontinuity</text>
  <line x1="645" y="370" x2="535" y2="305" class="connector"/>

  <text x="450" y="595" class="subtitle" text-anchor="middle">Original synthesis diagram; axis definitions are analyst judgements, not quotations from any source.</text>
</svg>