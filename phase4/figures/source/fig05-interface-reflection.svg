<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650">
  <defs>
    <style>
      .title { font: 700 16px 'DejaVu Sans', sans-serif; fill: #1a3a5c; }
      .subtitle { font: 12px 'DejaVu Sans', sans-serif; fill: #555; }
      .label { font: 11px 'DejaVu Sans', sans-serif; fill: #333; }
      .math { font: 12px 'DejaVu Sans', monospace; fill: #1a3a5c; }
      .interface { stroke: #1a3a5c; stroke-width: 3; fill: none; }
      .ray-inc { stroke: #2d6a2d; stroke-width: 3; fill: none; marker-end: url(#arrow-inc); }
      .ray-ref { stroke: #c0392b; stroke-width: 3; fill: none; marker-end: url(#arrow-ref); }
      .ray-trans { stroke: #2980b9; stroke-width: 3; fill: none; marker-end: url(#arrow-trans); }
      .normal { stroke: #666; stroke-width: 1.5; fill: #666; marker-end: url(#arrow-normal); }
      .arc { stroke: #666; stroke-width: 1.2; fill: none; }
      .angle-label { font: 10px 'DejaVu Sans', sans-serif; fill: #555; }
      .medium { font: 700 11px 'DejaVu Sans', sans-serif; fill: #1a3a5c; }
    </style>
    <marker id="arrow-inc" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <polygon points="0,0 9,4.5 0,9" fill="#2d6a2d"/>
    </marker>
    <marker id="arrow-ref" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <polygon points="0,0 9,4.5 0,9" fill="#c0392b"/>
    </marker>
    <marker id="arrow-trans" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <polygon points="0,0 9,4.5 0,9" fill="#2980b9"/>
    </marker>
    <marker id="arrow-normal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#666"/>
    </marker>
  </defs>
  
  <rect width="1000" height="650" fill="white"/>
  
  <text x="500" y="26" class="title" text-anchor="middle">Figure 5. Interface reflection and transmission</text>
  <text x="500" y="44" class="subtitle" text-anchor="middle">Incident, reflected, and transmitted waves at a bonded interface between two media</text>
  
  <!-- Interface line -->
  <line x1="100" y1="320" x2="900" y2="320" class="interface"/>
  <text x="910" y="325" class="label">Interface x₃ = 0</text>
  
  <!-- Medium labels -->
  <text x="500" y="70" class="medium" text-anchor="middle">Medium 1 (x₃ &lt; 0)</text>
  <text x="500" y="570" class="medium" text-anchor="middle">Medium 2 (x₃ &gt; 0)</text>
  
  <!-- Interface normal -->
  <line x1="450" y1="100" x2="450" y2="540" class="normal"/>
  <text x="455" y="90" class="label" font-size="10">Interface normal n̂</text>
  
  <!-- Incident ray (from top-left) -->
  <path d="M 150 100 L 450 320" class="ray-inc"/>
  <text x="180" y="120" class="math" font-size="12">A_inc</text>
  <text x="200" y="140" class="label" font-size="10">Incident wave</text>
  
  <!-- Reflected ray (to top-right) -->
  <path d="M 450 320 L 750 100" class="ray-ref"/>
  <text x="780" y="120" class="math" font-size="12">A_ref</text>
  <text x="740" y="140" class="label" font-size="10">Reflected wave</text>
  
  <!-- Transmitted ray (to bottom-right) -->
  <path d="M 450 320 L 750 540" class="ray-trans"/>
  <text x="780" y="520" class="math" font-size="12">A_trans</text>
  <text x="740" y="560" class="label" font-size="10">Transmitted wave</text>
  
  <!-- Incidence angle θᵢ -->
  <path d="M 450 320 A 80 80 0 0 1 520 250" class="arc"/>
  <text x="525" y="255" class="angle-label" font-size="11">θᵢ</text>
  
  <!-- Reflection angle θᵣ -->
  <path d="M 450 320 A 80 80 0 0 1 380 250" class="arc"/>
  <text x="375" y="255" class="angle-label" font-size="11">θᵣ</text>
  
  <!-- Transmission angle θₜ -->
  <path d="M 450 320 A 90 90 0 0 0 540 390" class="arc"/>
  <text x="545" y="395" class="angle-label" font-size="11">θₜ</text>
  
  <!-- Energy flux labels -->
  <text x="320" y="280" class="label" font-size="10">J_inc = σⱼᵢvᵢ + qᵢ</text>
  <text x="320" y="295" class="label" font-size="10">(incident energy flux)</text>
  <text x="680" y="280" class="label" font-size="10">J_ref = σⱼᵢvᵢ + qᵢ</text>
  <text x="680" y="295" class="label" font-size="10">(reflected energy flux)</text>
  <text x="680" y="480" class="label" font-size="10">J_trans = σⱼᵢvᵢ + qᵢ</text>
  <text x="680" y="495" class="label" font-size="10">(transmitted energy flux)</text>
  
  <!-- Interface conditions box -->
  <rect x="40" y="470" width="360" height="150" fill="#f8f9fa" stroke="#cccccc" stroke-width="1"/>
  <text x="55" y="488" class="label" font-weight="bold">Interface conditions (perfect bonding):</text>
  <text x="55" y="508" class="math" font-size="10">u⁽¹⁾ᵢ = u⁽²⁾ᵢ</text>
  <text x="80" y="508" class="label" font-size="10">(displacement continuity)</text>
  <text x="55" y="528" class="math" font-size="10">σ⁽¹⁾ⱼᵢnⱼ = σ⁽²⁾ⱼᵢnⱼ</text>
  <text x="170" y="528" class="label" font-size="10">(traction equilibrium)</text>
  <text x="55" y="548" class="math" font-size="10">T⁽¹⁾ = T⁽²⁾</text>
  <text x="110" y="548" class="label" font-size="10">(temperature continuity)</text>
  <text x="55" y="568" class="math" font-size="10">q⁽¹⁾ᵢnᵢ = q⁽²⁾ᵢnᵢ</text>
  <text x="170" y="568" class="label" font-size="10">(heat flux continuity)</text>
  
  <!-- Conservation identity -->
  <rect x="440" y="470" width="360" height="150" fill="#eef3f8" stroke="#1a3a5c" stroke-width="1.5"/>
  <text x="455" y="488" class="label" font-weight="bold">Energy conservation:</text>
  <text x="455" y="510" class="math" font-size="13">R + T + A = 1</text>
  <text x="455" y="530" class="label" font-size="10">R: reflected energy fraction</text>
  <text x="455" y="548" class="label" font-size="10">T: transmitted energy fraction</text>
  <text x="455" y="566" class="label" font-size="10">A: absorbed (dissipated) fraction</text>
  <text x="455" y="586" class="label" font-size="10">(holds for passive interface, no dissipation)</text>
  
  <!-- Notes -->
  <text x="830" y="490" class="subtitle" font-size="10" text-anchor="start">For generalized theories, energy flux forms are open derivations (Section 10.3).</text>
  <text x="830" y="510" class="subtitle" font-size="10" text-anchor="start">Conservation identity verified for classical media (BM-1 benchmark).</text>
</svg>