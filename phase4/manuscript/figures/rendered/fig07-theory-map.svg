<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="750" viewBox="0 0 1100 750">
  <defs>
    <style>
      .title { font: 700 16px 'DejaVu Sans', sans-serif; fill: #1a3a5c; }
      .subtitle { font: 12px 'DejaVu Sans', sans-serif; fill: #555; }
      .theory { font: 700 11px 'DejaVu Sans', sans-serif; fill: #1a3a5c; text-anchor: middle; }
      .year { font: 10px 'DejaVu Sans', sans-serif; fill: #666; text-anchor: middle; }
      .source { font: 9px 'DejaVu Sans', sans-serif; fill: #888; text-anchor: middle; font-style: italic; }
      .node-classical { fill: #e8f2e8; stroke: #2d6a2d; stroke-width: 1.5; rx: 7; ry: 7; }
      .node-ls { fill: #e8f0ff; stroke: #2980b9; stroke-width: 1.5; rx: 7; ry: 7; }
      .node-gl { fill: #fdeaea; stroke: #c0392b; stroke-width: 1.5; rx: 7; ry: 7; }
      .node-gn { fill: #fdf2e8; stroke: #d35400; stroke-width: 1.5; rx: 7; ry: 7; }
      .node-dpl { fill: #f4e8f2; stroke: #8e44ad; stroke-width: 1.5; rx: 7; ry: 7; }
      .node-mdd { fill: #e8f8f5; stroke: #16a085; stroke-width: 1.5; rx: 7; ry: 7; }
      .node-nonlocal { fill: #fff3e8; stroke: #e67e22; stroke-width: 1.5; rx: 7; ry: 7; }
      .arrow { stroke: #666; stroke-width: 1.5; fill: #666; marker-end: url(#arrowhead); }
      .arrow-dashed { stroke: #8fa8bd; stroke-width: 1.2; stroke-dasharray: 4,3; fill: #8fa8bd; marker-end: url(#arrowhead); }
      .limiting-case { font: 9px 'DejaVu Sans', sans-serif; fill: #555; background: white; padding: 2px; }
    </style>
    <marker id="arrowhead" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0,0 7,3.5 0,7" fill="#666"/>
    </marker>
  </defs>
  
  <rect width="1100" height="750" fill="white"/>
  
  <text x="550" y="26" class="title" text-anchor="middle">Generalized thermoelasticity theory map</text>
  <text x="550" y="44" class="subtitle" text-anchor="middle">Relationships among classical and generalized thermal transport theories</text>
  
  <!-- Classical (CD) at top-left -->
  <rect x="80" y="100" width="150" height="80" class="node-classical"/>
  <text x="155" y="125" class="theory">Classical coupled</text>
  <text x="155" y="142" class="theory" font-size="10">thermoelasticity (CD)</text>
  <text x="155" y="158" class="year">Biot, 1956</text>
  <text x="155" y="172" class="source">Fourier heat conduction</text>
  
  <!-- Lord-Shulman (top-center) -->
  <rect x="300" y="80" width="150" height="80" class="node-ls"/>
  <text x="375" y="105" class="theory">Lord–Shulman (LS)</text>
  <text x="375" y="122" class="year">1967</text>
  <text x="375" y="138" class="source">One relaxation time τ₀</text>
  <text x="375" y="154" class="source">Finite thermal wave speed</text>
  
  <!-- Green-Lindsay (top-right) -->
  <rect x="520" y="100" width="150" height="80" class="node-gl"/>
  <text x="595" y="125" class="theory">Green–Lindsay (GL)</text>
  <text x="595" y="142" class="year">1972</text>
  <text x="595" y="158" class="source">Two relaxation times</text>
  <text x="595" y="172" class="source">Temperature-rate dependent</text>
  
  <!-- GN-II (middle-left) -->
  <rect x="80" y="280" width="150" height="80" class="node-gn"/>
  <text x="155" y="305" class="theory">G–N Type II</text>
  <text x="155" y="322" class="year">1991</text>
  <text x="155" y="338" class="source">No energy dissipation</text>
  <text x="155" y="354" class="source">Thermal displacement α</text>
  
  <!-- GN-III (middle-center) -->
  <rect x="300" y="280" width="150" height="80" class="node-gn"/>
  <text x="375" y="305" class="theory">G–N Type III</text>
  <text x="375" y="322" class="year">1993</text>
  <text x="375" y="338" class="source">Dissipative</text>
  <text x="375" y="354" class="source">Mixed type I/II character</text>
  
  <!-- DPL (middle-right) -->
  <rect x="520" y="280" width="150" height="80" class="node-dpl"/>
  <text x="595" y="305" class="theory">Dual-phase-lag</text>
  <text x="595" y="322" class="year">(DPL), 1995</text>
  <text x="595" y="338" class="source">Two phase lags τq, τT</text>
  <text x="595" y="354" class="source">τq ≥ τT (admissibility)</text>
  
  <!-- TPL (bottom-left) -->
  <rect x="80" y="460" width="150" height="80" class="node-dpl"/>
  <text x="155" y="485" class="theory">Triple-phase-lag</text>
  <text x="155" y="502" class="year">(TPL), 1997</text>
  <text x="155" y="518" class="source">Three phase lags</text>
  <text x="155" y="534" class="source">Thermal displacement gradient</text>
  
  <!-- MGT (bottom-center) -->
  <rect x="300" y="460" width="150" height="80" class="node-mdd"/>
  <text x="375" y="485" class="theory">Moore–Gibson–Thompson</text>
  <text x="375" y="502" class="year">(MGT)</text>
  <text x="375" y="518" class="source">Third-order heat equation</text>
  <text x="375" y="534" class="source">Thermal inertia</text>
  
  <!-- MDD (bottom-right) -->
  <rect x="520" y="460" width="150" height="80" class="node-mdd"/>
  <text x="595" y="485" class="theory">Memory-dependent</text>
  <text x="595" y="502" class="year">derivative (MDD)</text>
  <text x="595" y="518" class="year">Wang &amp; Li, 2011</text>
  <text x="595" y="534" class="source">Integral-form memory operator</text>
  
  <!-- Nonlocal (far right) -->
  <rect x="740" y="280" width="150" height="80" class="node-nonlocal"/>
  <text x="815" y="305" class="theory">Nonlocal elasticity</text>
  <text x="815" y="322" class="year">(Eringen)</text>
  <text x="815" y="338" class="source">Integral constitutive relations</text>
  <text x="815" y="354" class="source">Length scale (e₀a)²</text>
  
  <!-- Arrows: limiting relationships -->
  <!-- CD → LS -->
  <path d="M 230 140 Q 290 140 300 120" class="arrow"/>
  <text x="270" y="110" class="limiting-case">τ₀ → 0</text>
  
  <!-- LS → CD -->
  <path d="M 300 160 Q 290 160 230 140" class="arrow-dashed"/>
  
  <!-- CD → GL -->
  <path d="M 230 180 Q 380 180 520 140" class="arrow"/>
  <text x="380" y="170" class="limiting-case">Two relaxation times</text>
  
  <!-- LS → GN-II -->
  <path d="M 375 160 Q 375 220 375 280" class="arrow"/>
  <text x="385" y="220" class="limiting-case" font-size="8">Special limit</text>
  
  <!-- GL → GN-II -->
  <path d="M 520 180 Q 450 220 375 280" class="arrow-dashed"/>
  <text x="440" y="230" class="limiting-case" font-size="8">K → 0 limit</text>
  
  <!-- DPL → TPL -->
  <path d="M 595 360 Q 595 420 155 460" class="arrow"/>
  <text x="500" y="400" class="limiting-case" font-size="8">Add τν</text>
  
  <!-- MDD → classical -->
  <path d="M 595 540 Q 595 580 155 540" class="arrow-dashed"/>
  <text x="380" y="565" class="limiting-case" font-size="8">ω → 0, kernel → 1</text>
  
  <!-- Nonlocal separate (no direct limiting arrow) -->
  <text x="815" y="380" class="limiting-case" font-size="9" text-anchor="middle">Spatial nonlocality</text>
  <text x="815" y="395" class="limiting-case" font-size="9" text-anchor="middle">Independent axis</text>
  
  <!-- Verification status legend -->
  <rect x="740" y="460" width="320" height="240" fill="#f8f9fa" stroke="#cccccc" stroke-width="1"/>
  <text x="755" y="478" class="label" font-weight="bold" style="font-size: 12px;">Verification status:</text>
  <text x="755" y="498" class="label" font-size="10">● CD: Classical flux VERIFIED</text>
  <text x="755" y="516" class="label" font-size="10">● LS: Frequency-domain flux PARTIAL</text>
  <text x="755" y="534" class="label" font-size="10">● GL: Energy flux UNCERTAIN</text>
  <text x="755" y="552" class="label" font-size="10">● GN-II: Energy flux UNCERTAIN</text>
  <text x="755" y="570" class="label" font-size="10">● GN-III: Energy flux UNCERTAIN</text>
  <text x="755" y="588" class="label" font-size="10">● DPL: Frequency-domain PARTIAL</text>
  <text x="755" y="606" class="label" font-size="10">● TPL, MGT, MDD: UNCERTAIN</text>
  <text x="755" y="624" class="label" font-size="10">● Nonlocal: Integral flux UNCERTAIN</text>
  <text x="755" y="642" class="label" font-size="10" style="font-style: italic;">UNCERTAIN = open derivation, not canonical</text>
  
  <!-- Notes -->
  <text x="80" y="700" class="subtitle" font-size="10">All dates and primary sources are DOI-verified. Limiting relationships are parameter substitutions, not rigorous limit theorems.</text>
  <text x="80" y="720" class="subtitle" font-size="10">Energy flux formulations for generalized theories remain open (Section 10.3, OQ10.1–OQ10.8).</text>
</svg>