<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650">
  <defs>
    <style>
      .title { font: 700 16px 'DejaVu Sans', sans-serif; fill: #1a3a5c; }
      .subtitle { font: 12px 'DejaVu Sans', sans-serif; fill: #555; }
      .label { font: 11px 'DejaVu Sans', sans-serif; fill: #333; }
      .math { font: 12px 'DejaVu Sans', monospace; fill: #1a3a5c; }
      .head { font: 700 12px 'DejaVu Sans', sans-serif; fill: #1a3a5c; }
      .panel { fill: none; stroke: #c8d2dc; stroke-width: 1.2; }
      .rowa { fill: #f2f6fa; stroke: #1a3a5c; stroke-width: 1.2; }
      .rowb { fill: #eaf2fa; stroke: #2980b9; stroke-width: 1.2; }
      .rowc { fill: #fdf3e7; stroke: #e67e22; stroke-width: 1.2; }
      .rowd { fill: #eaf6ea; stroke: #2d6a2d; stroke-width: 1.2; }
      .pill { fill: #1a3a5c; }
      .pill2 { fill: #2980b9; }
      .pill3 { fill: #e67e22; }
      .pill4 { fill: #2d6a2d; }
      .pilltext { font: 700 10px 'DejaVu Sans', sans-serif; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1000" height="650" fill="white"/>

  <text x="500" y="26" class="title" text-anchor="middle">Wave types supported by different continuum media</text>
  <text x="500" y="44" class="subtitle" text-anchor="middle">The modal content of a medium is fixed by its governing equations, and the number of modes is the most immediate observable of a coupling</text>

  <!-- header row -->
  <text x="60" y="80" class="head">Medium</text>
  <text x="290" y="80" class="head">Mechanical modes</text>
  <text x="480" y="80" class="head">Thermal modes</text>
  <text x="660" y="80" class="head">Coupled / extra modes</text>
  <text x="930" y="80" class="head" text-anchor="end">Thermal speed</text>
  <line x1="45" y1="90" x2="955" y2="90" stroke="#1a3a5c" stroke-width="1.5"/>

  <!-- row 1: classical elastic -->
  <rect x="45" y="100" width="910" height="60" rx="5" class="rowa"/>
  <text x="60" y="124" class="head">Classical elastic</text>
  <text x="60" y="144" class="label" font-size="10">isotropic solid</text>
  <text x="290" y="134" class="label">P (longitudinal), S (transverse)</text>
  <text x="480" y="134" class="label" font-size="11">none — heat is not a field</text>
  <text x="660" y="134" class="label">—</text>
  <text x="930" y="134" class="math" text-anchor="end">not applicable</text>

  <!-- row 2: classical coupled thermoelastic -->
  <rect x="45" y="166" width="910" height="60" rx="5" class="rowb"/>
  <text x="60" y="190" class="head">Coupled thermoelastic</text>
  <text x="60" y="210" class="label" font-size="10">Biot (1956)</text>
  <text x="290" y="200" class="label">P, S (temperature couples to the</text>
  <text x="290" y="214" class="label" font-size="10">mechanics only as a static source)</text>
  <text x="480" y="200" class="label">diffusive, no separate wave</text>
  <text x="660" y="200" class="label" font-size="10">βT₀ u̇ᵢ,ᵢ term</text>
  <text x="930" y="200" class="math" text-anchor="end">infinite (parabolic)</text>

  <!-- row 3: generalized thermoelastic -->
  <rect x="45" y="232" width="910" height="60" rx="5" class="rowc"/>
  <text x="60" y="256" class="head">Generalized thermoelastic</text>
  <text x="60" y="276" class="label" font-size="10">LS, GL, GN, DPL, TPL, MGT</text>
  <text x="290" y="246" class="label">P, S, and the mechanical response is</text>
  <text x="290" y="260" class="label" font-size="10">now coupled to a propagating thermal field</text>
  <text x="480" y="246" class="label">T (thermal wave), attenuated in</text>
  <text x="480" y="260" class="label" font-size="10">the dissipative families, conservative</text>
  <text x="480" y="274" class="label" font-size="10">in GN type II</text>
  <text x="660" y="246" class="label" font-size="10">relaxation terms in the thermal law</text>
  <text x="930" y="246" class="math" text-anchor="end">finite, c_T</text>
  <text x="930" y="260" class="math" text-anchor="end" font-size="10">c_T = √(2K(T₀)τ₀/(ρc_v))</text>

  <!-- row 4: piezothermoelastic -->
  <rect x="45" y="298" width="910" height="60" rx="5" class="rowd"/>
  <text x="60" y="322" class="head">Piezothermoelastic</text>
  <text x="60" y="342" class="label" font-size="10">coupled electric field</text>
  <text x="290" y="322" class="label">qP, qS (quasi-longitudinal,</text>
  <text x="290" y="336" class="label" font-size="10">quasi-transverse)</text>
  <text x="480" y="322" class="label">T (thermal wave)</text>
  <text x="660" y="322" class="label" font-size="10">electromagnetic mode (EM)</text>
  <text x="660" y="336" class="label" font-size="10">coupled to the elastic and thermal modes</text>
  <text x="930" y="322" class="math" text-anchor="end">finite, c_T</text>

  <!-- row 5: nonlocal / fractional / memory -->
  <rect x="45" y="364" width="910" height="60" rx="5" class="rowb"/>
  <text x="60" y="388" class="head">Nonlocal / fractional / memory</text>
  <text x="60" y="408" class="label" font-size="10">generalized continuum</text>
  <text x="290" y="388" class="label">P, S — now dispersive, the wave</text>
  <text x="290" y="402" class="label" font-size="10">speed depends on the wave number</text>
  <text x="480" y="388" class="label">T, dispersive when the memory</text>
  <text x="480" y="402" class="label" font-size="10">kernel is not exponential</text>
  <text x="660" y="388" class="label" font-size="10">micro-rotation (micropolar), extra</text>
  <text x="660" y="402" class="label" font-size="10">temperature (two/three-temperature)</text>
  <text x="930" y="388" class="math" text-anchor="end">finite, dispersive</text>

  <!-- ================= modal count summary ================= -->
  <rect x="45" y="446" width="910" height="158" rx="6" class="panel"/>
  <text x="500" y="468" class="head" text-anchor="middle">Modal count and the size of the interface problem</text>

  <rect x="80" y="482" width="190" height="30" rx="15" class="pill"/>
  <text x="175" y="502" class="pilltext" text-anchor="middle">P, S&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;2 modes</text>
  <text x="285" y="502" class="label" font-size="10">classical elastic — 2 × 2 interface system</text>

  <rect x="80" y="518" width="240" height="30" rx="15" class="pill2"/>
  <text x="200" y="538" class="pilltext" text-anchor="middle">P, S, T&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;3 modes</text>
  <text x="335" y="538" class="label" font-size="10">generalized thermoelastic — 3 × 3, with the thermal wave evanescent or propagating</text>

  <rect x="80" y="554" width="300" height="30" rx="15" class="pill3"/>
  <text x="230" y="574" class="pilltext" text-anchor="middle">qP, qS, T, EM&#160;&#160;&#160;&#160;&#160;&#160;&#160;4 modes</text>
  <text x="395" y="574" class="label" font-size="10">piezothermoelastic — 4 × 4, the electromagnetic mode is the stiffest</text>

  <rect x="80" y="590" width="350" height="30" rx="15" class="pill4"/>
  <text x="255" y="610" class="pilltext" text-anchor="middle">P, S, T, µ, T′, EM&#160;&#160;6 modes</text>
  <text x="445" y="610" class="label" font-size="10">multiphysics with micro-structure — 6 × 6, and the secular polynomial is of order 12</text>

  <text x="500" y="640" class="label" text-anchor="middle" font-size="10">Original figure prepared for this review. The modal counts are those obtained from the secular equations of Section 8.3; the interface systems are those of Section 9.</text>
</svg>
