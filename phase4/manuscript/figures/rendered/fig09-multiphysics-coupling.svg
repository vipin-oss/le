<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="750" viewBox="0 0 1100 750">
  <defs>
    <style>
      .title { font: 700 16px 'DejaVu Sans', sans-serif; fill: #1a3a5c; }
      .subtitle { font: 12px 'DejaVu Sans', sans-serif; fill: #555; }
      .field { font: 700 12px 'DejaVu Sans', sans-serif; fill: #1a3a5c; }
      .coupling { font: 10px 'DejaVu Sans', sans-serif; fill: #555; }
      .node { fill: #eef3f8; stroke: #1a3a5c; stroke-width: 1.5; rx: 7; ry: 7; }
      .node-mech { fill: #e8f2e8; stroke: #2d6a2d; stroke-width: 1.5; rx: 7; ry: 7; }
      .node-therm { fill: #fdeaea; stroke: #c0392b; stroke-width: 1.5; rx: 7; ry: 7; }
      .node-elec { fill: #e8f0ff; stroke: #2980b9; stroke-width: 1.5; rx: 7; ry: 7; }
      .node-poro { fill: #fdf2e8; stroke: #d35400; stroke-width: 1.5; rx: 7; ry: 7; }
      .node-carrier { fill: #f4e8f2; stroke: #8e44ad; stroke-width: 1.5; rx: 7; ry: 7; }
      .node-micro { fill: #e8f8f5; stroke: #16a085; stroke-width: 1.5; rx: 7; ry: 7; }
      .arrow { stroke: #666; stroke-width: 1.8; fill: #666; marker-end: url(#arrowhead); }
      .arrow-mech { stroke: #2d6a2d; stroke-width: 2; fill: #2d6a2d; marker-end: url(#arrowhead-mech); }
      .arrow-therm { stroke: #c0392b; stroke-width: 2; fill: #c0392b; marker-end: url(#arrowhead-therm); }
      .arrow-elec { stroke: #2980b9; stroke-width: 2; fill: #2980b9; marker-end: url(#arrowhead-elec); }
      .arrow-poro { stroke: #d35400; stroke-width: 2; fill: #d35400; marker-end: url(#arrowhead-poro); }
      .arrow-carrier { stroke: #8e44ad; stroke-width: 2; fill: #8e44ad; marker-end: url(#arrowhead-carrier); }
      .arrow-micro { stroke: #16a085; stroke-width: 2; fill: #16a085; marker-end: url(#arrowhead-micro); }
      .coupling-label { font: 9px 'DejaVu Sans', sans-serif; fill: #555; background: white; padding: 2px; }
    </style>
    <marker id="arrowhead" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0,0 7,3.5 0,7" fill="#666"/>
    </marker>
    <marker id="arrowhead-mech" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0,0 7,3.5 0,7" fill="#2d6a2d"/>
    </marker>
    <marker id="arrowhead-therm" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0,0 7,3.5 0,7" fill="#c0392b"/>
    </marker>
    <marker id="arrowhead-elec" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0,0 7,3.5 0,7" fill="#2980b9"/>
    </marker>
    <marker id="arrowhead-poro" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0,0 7,3.5 0,7" fill="#d35400"/>
    </marker>
    <marker id="arrowhead-carrier" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0,0 7,3.5 0,7" fill="#8e44ad"/>
    </marker>
    <marker id="arrowhead-micro" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0,0 7,3.5 0,7" fill="#16a085"/>
    </marker>
  </defs>
  
  <rect width="1100" height="750" fill="white"/>
  
  <text x="550" y="30" class="title" text-anchor="middle">Conceptual map of multiphysics continuum interactions</text>
  <text x="550" y="48" class="subtitle" text-anchor="middle">Coupling domains and their governing relationships in generalized continuum mechanics</text>
  
  <!-- Central node: Continuum body -->
  <rect x="480" y="280" width="140" height="90" class="node"/>
  <text x="550" y="305" class="field" text-anchor="middle">Continuum</text>
  <text x="550" y="322" class="field" text-anchor="middle">Body</text>
  <text x="550" y="342" class="coupling" text-anchor="middle">(displacement, stress,</text>
  <text x="550" y="356" class="coupling" text-anchor="middle">strain fields)</text>
  
  <!-- Mechanical field (left) -->
  <rect x="60" y="200" width="130" height="80" class="node-mech"/>
  <text x="125" y="225" class="field" text-anchor="middle">Mechanical</text>
  <text x="125" y="242" class="field" text-anchor="middle">(uᵢ, σᵢⱼ, εᵢⱼ)</text>
  <text x="125" y="260" class="coupling" text-anchor="middle">Navier equations</text>
  
  <!-- Thermal field (top) -->
  <rect x="440" y="60" width="130" height="80" class="node-therm"/>
  <text x="505" y="85" class="field" text-anchor="middle">Thermal</text>
  <text x="505" y="102" class="field" text-anchor="middle">(T, qᵢ)</text>
  <text x="505" y="120" class="coupling" text-anchor="middle">Heat conduction</text>
  
  <!-- Electrical field (right) -->
  <rect x="910" y="200" width="130" height="80" class="node-elec"/>
  <text x="975" y="225" class="field" text-anchor="middle">Electrical</text>
  <text x="975" y="242" class="field" text-anchor="middle">(Eᵢ, Dᵢ, φ)</text>
  <text x="975" y="260" class="coupling" text-anchor="middle">Maxwell's equations</text>
  
  <!-- Porosity field (bottom-left) -->
  <rect x="60" y="420" width="130" height="80" class="node-poro"/>
  <text x="125" y="445" class="field" text-anchor="middle">Porosity</text>
  <text x="125" y="462" class="field" text-anchor="middle">(φ, void fraction)</text>
  <text x="125" y="480" class="coupling" text-anchor="middle">Cowin–Nunziato</text>
  
  <!-- Carrier field (bottom-right) -->
  <rect x="910" y="420" width="130" height="80" class="node-carrier"/>
  <text x="975" y="445" class="field" text-anchor="middle">Carrier</text>
  <text x="975" y="462" class="field" text-anchor="middle">(n, diffusion)</text>
  <text x="975" y="480" class="coupling" text-anchor="middle">Semiconductor transport</text>
  
  <!-- Micropolar field (bottom-center) -->
  <rect x="440" y="560" width="130" height="80" class="node-micro"/>
  <text x="505" y="585" class="field" text-anchor="middle">Micropolar</text>
  <text x="505" y="602" class="field" text-anchor="middle">(ϕᵢ, couple stress)</text>
  <text x="505" y="620" class="coupling" text-anchor="middle">Eringen theory</text>
  
  <!-- Coupling arrows: Mechanical <-> Thermal -->
  <path d="M 125 220 Q 300 150 440 90" class="arrow-therm"/>
  <path d="M 440 140 Q 300 210 125 260" class="arrow-mech"/>
  <text x="280" y="145" class="coupling-label" text-anchor="middle">Thermoelastic coupling (βT)</text>
  
  <!-- Mechanical <-> Electrical -->
  <path d="M 190 240 Q 350 240 510 320" class="arrow-elec"/>
  <path d="M 590 320 Q 750 240 910 240" class="arrow-mech"/>
  <text x="550" y="210" class="coupling-label" text-anchor="middle">Piezoelectric coupling (e, d)</text>
  
  <!-- Thermal <-> Electrical (pyroelectric) -->
  <path d="M 570 80 Q 700 200 910 280" class="arrow-therm"/>
  <path d="M 880 320 Q 700 400 570 520" class="arrow-elec"/>
  <text x="760" y="220" class="coupling-label" text-anchor="middle">Pyroelectric effect (pᵢ)</text>
  
  <!-- Mechanical <-> Porosity -->
  <path d="M 95 280 Q 95 380 95 420" class="arrow-poro"/>
  <path d="M 125 440 Q 125 340 125 280" class="arrow-mech"/>
  <text x="70" y="350" class="coupling-label" text-anchor="middle" transform="rotate(-90 70,350)">Void fraction coupling</text>
  
  <!-- Mechanical <-> Micropolar -->
  <path d="M 480 370 Q 480 480 440 560" class="arrow-micro"/>
  <path d="M 505 640 Q 505 540 550 370" class="arrow-mech"/>
  <text x="460" y="510" class="coupling-label" text-anchor="middle" transform="rotate(-90 460,510)">Micro-rotation coupling</text>
  
  <!-- Thermal <-> Porosity -->
  <path d="M 440 140 Q 350 240 95 420" class="arrow-therm"/>
  <path d="M 125 500 Q 210 400 350 300" class="arrow-poro"/>
  <text x="220" y="380" class="coupling-label" text-anchor="middle">Thermo-poroelastic coupling</text>
  
  <!-- Electrical <-> Carrier -->
  <path d="M 975 280 Q 1050 360 975 420" class="arrow-carrier"/>
  <path d="M 975 500 Q 1050 420 975 340" class="arrow-elec"/>
  <text x="1030" y="400" class="coupling-label" text-anchor="middle" transform="rotate(90 1030,400)">Carrier-electrical coupling</text>
  
  <!-- Legend -->
  <rect x="60" y="640" width="300" height="90" fill="#f8f9fa" stroke="#cccccc" stroke-width="1"/>
  <text x="75" y="660" class="field">Coupling types:</text>
  <line x1="75" y1="672" x2="95" y2="672" class="arrow-mech"/>
  <text x="100" y="676" class="coupling" font-size="9">Mechanical</text>
  <line x1="75" y1="684" x2="95" y2="684" class="arrow-therm"/>
  <text x="100" y="688" class="coupling" font-size="9">Thermal</text>
  <line x1="75" y1="696" x2="95" y2="696" class="arrow-elec"/>
  <text x="100" y="700" class="coupling" font-size="9">Electrical</text>
  <line x1="75" y1="712" x2="95" y2="712" class="arrow-poro"/>
  <text x="100" y="716" class="coupling" font-size="9">Porosity</text>
  <line x1="75" y1="724" x2="95" y2="724" class="arrow-carrier"/>
  <text x="100" y="728" class="coupling" font-size="9">Carrier</text>
  
  <text x="400" y="660" class="field">Verified model families:</text>
  <text x="400" y="678" class="coupling" font-size="9">Piezothermoelasticity (§5.2)</text>
  <text x="400" y="696" class="coupling" font-size="9">Thermo-poroelasticity (§5.4)</text>
  <text x="400" y="714" class="coupling" font-size="9">Micropolar thermoelasticity (§5.5)</text>
  
  <!-- Notes -->
  <text x="600" y="730" class="subtitle" font-size="10" text-anchor="middle">All coupling relationships are drawn from verified constitutive equations (Section 5).</text>
</svg>