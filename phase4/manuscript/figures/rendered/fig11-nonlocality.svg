<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650">
  <defs>
    <style>
      .title { font: 700 16px 'DejaVu Sans', sans-serif; fill: #1a3a5c; }
      .subtitle { font: 12px 'DejaVu Sans', sans-serif; fill: #555; }
      .label { font: 11px 'DejaVu Sans', sans-serif; fill: #333; }
      .math { font: 12px 'DejaVu Sans', monospace; fill: #1a3a5c; }
      .panel { fill: none; stroke: #c8d2dc; stroke-width: 1.2; }
      .kernel { stroke: #2d6a2d; stroke-width: 2.5; fill: none; }
      .kernelfill { fill: #d6ead6; opacity: 0.75; }
      .axis { stroke: #444; stroke-width: 1.4; fill: none; }
      .nonloc { stroke: #1a3a5c; stroke-width: 2.6; fill: none; }
      .grad { stroke: #c0392b; stroke-width: 2.6; fill: none; }
      .dotted { stroke: #888; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
      .box { fill: #f2f6fa; stroke: #1a3a5c; stroke-width: 1.2; }
      .head { font: 700 12px 'DejaVu Sans', sans-serif; fill: #1a3a5c; }
    </style>
  </defs>

  <rect width="1000" height="650" fill="white"/>

  <text x="500" y="26" class="title" text-anchor="middle">Size-dependent response: neighbourhood averaging and the discriminating dispersion signature</text>
  <text x="500" y="44" class="subtitle" text-anchor="middle">Left: the nonlocal constitutive mechanism. Right: nonlocal and gradient mechanisms predict different wave speeds at the same wave number</text>

  <!-- ================= LEFT PANEL: nonlocal averaging ================= -->
  <rect x="45" y="66" width="430" height="300" rx="6" class="panel"/>
  <text x="260" y="88" class="head" text-anchor="middle">Neighbourhood averaging (nonlocal mechanism)</text>

  <path d="M 80 300 C 130 300, 150 120, 260 120 C 370 120, 390 300, 440 300" class="kernelfill"/>
  <path d="M 80 300 C 130 300, 150 120, 260 120 C 370 120, 390 300, 440 300" class="kernel"/>
  <line x1="80" y1="300" x2="440" y2="300" class="axis"/>
  <line x1="260" y1="108" x2="260" y2="300" class="dotted"/>
  <text x="260" y="330" class="math" text-anchor="middle">x</text>
  <text x="260" y="112" class="math" text-anchor="middle">α(|x′ − x|)</text>
  <text x="120" y="316" class="label" font-size="10">x′</text>
  <text x="360" y="316" class="label" font-size="10">x′</text>
  <text x="268" y="292" class="label" font-size="10">x</text>
  <text x="150" y="160" class="label" font-size="10">kernel weight</text>

  <rect x="80" y="338" width="360" height="24" rx="4" class="box"/>
  <text x="260" y="354" class="math" text-anchor="middle">σᵢⱼ(x) = ∫ α(|x′ − x|) σᵢⱼˡᵒᶜᵃˡ(x′) dΩ</text>
  <text x="260" y="380" class="label" text-anchor="middle">stress at x is a weighted average of the local stress nearby</text>

  <rect x="80" y="386" width="360" height="24" rx="4" class="box"/>
  <text x="260" y="402" class="math" text-anchor="middle">(1 − ξ²∇²) σᵢⱼ = σᵢⱼˡᵒᶜᵃˡ,&#160; ξ = e₀a</text>
  <text x="260" y="428" class="label" text-anchor="middle">differential form (Helmholtz kernel) — local but higher order</text>

  <!-- ================= RIGHT PANEL: dispersion ================= -->
  <rect x="525" y="66" width="430" height="300" rx="6" class="panel"/>
  <text x="740" y="88" class="head" text-anchor="middle">Dispersion signature of the two mechanisms</text>

  <line x1="590" y1="320" x2="915" y2="320" class="axis"/>
  <line x1="590" y1="320" x2="590" y2="110" class="axis"/>
  <text x="915" y="338" class="math" text-anchor="end">k (wave number)</text>
  <text x="596" y="116" class="math">c/c₀</text>

  <line x1="590" y1="130" x2="915" y2="130" class="dotted"/>
  <text x="900" y="124" class="label" font-size="10" text-anchor="end">c₀ (classical, k → 0)</text>

  <path d="M 590 130 C 660 131, 700 140, 740 160 C 790 186, 850 240, 915 300" class="nonloc"/>
  <path d="M 590 130 C 620 132, 650 142, 680 158 C 710 176, 740 200, 770 232 C 800 265, 840 290, 880 308" class="grad"/>

  <text x="806" y="196" class="label" font-size="11" fill="#1a3a5c">nonlocal: c = c₀/√(1+ξ²k²)</text>
  <text x="806" y="212" class="label" font-size="11" fill="#1a3a5c">saturating branch</text>
  <text x="700" y="292" class="label" font-size="11" fill="#c0392b">gradient: c² decreases</text>
  <text x="700" y="308" class="label" font-size="11" fill="#c0392b">linearly in k²</text>

  <line x1="860" y1="170" x2="860" y2="288" stroke="#e67e22" stroke-width="2.5"/>
  <text x="870" y="196" class="label" font-size="10" fill="#e67e22">same long-wave limit,</text>
  <text x="870" y="210" class="label" font-size="10" fill="#e67e22">different at finite k</text>

  <text x="740" y="352" class="label" text-anchor="middle">A dispersion measurement over a broad range of k separates the two mechanisms</text>

  <!-- ================= BOTTOM: three consequences ================= -->
  <rect x="45" y="392" width="910" height="212" rx="6" class="panel"/>
  <text x="500" y="414" class="head" text-anchor="middle">Consequences for the continuum description</text>

  <rect x="70" y="430" width="270" height="150" rx="5" class="box"/>
  <text x="205" y="452" class="head" text-anchor="middle">1 · Size-dependent stiffness</text>
  <text x="84" y="474" class="label">The apparent modulus grows as the</text>
  <text x="84" y="490" class="label">body becomes small compared with the</text>
  <text x="84" y="506" class="label">internal length ξ = e₀a.</text>
  <text x="84" y="532" class="math" font-size="11">τ = e₀a/ℓ</text>
  <text x="84" y="550" class="label" font-size="10">nonlocal parameter: internal /</text>
  <text x="84" y="564" class="label" font-size="10">external length scale</text>

  <rect x="365" y="430" width="270" height="150" rx="5" class="box"/>
  <text x="500" y="452" class="head" text-anchor="middle">2 · Order is raised</text>
  <text x="379" y="474" class="label">The differential form raises the order</text>
  <text x="379" y="490" class="label">of the governing equation, and the</text>
  <text x="379" y="506" class="label">initial-value problem is no longer</text>
  <text x="379" y="522" class="label">well posed in the classical sense.</text>
  <text x="379" y="548" class="label" font-size="10">Remedy: bounded kernel, or a</text>
  <text x="379" y="564" class="label" font-size="10">variational (quadratic) formulation</text>

  <rect x="660" y="430" width="270" height="150" rx="5" class="box"/>
  <text x="795" y="452" class="head" text-anchor="middle">3 · Energy flux changes</text>
  <text x="674" y="474" class="label">The divergence theorem must be</text>
  <text x="674" y="490" class="label">modified: the stress power at a point</text>
  <text x="674" y="506" class="label">samples a neighbourhood, so an extra</text>
  <text x="674" y="522" class="label">surface term appears in the flux.</text>
  <text x="674" y="548" class="math" font-size="11">Jᵢ = σⱼᵢvᵢ + qᵢ + Jᵢⁿᵒⁿˡᵒᶜᵃˡ</text>
  <text x="674" y="564" class="label" font-size="10">without it the energy balance does not close</text>

  <text x="500" y="636" class="label" text-anchor="middle" font-size="10">Original figure prepared for this review. All three panels are direct consequences of the constitutive laws stated in Sections 7.1–7.6.</text>
</svg>
