<svg xmlns="http://www.w3.org/2000/svg" width="500" height="400" viewBox="0 0 500 400" font-family="Arial, sans-serif">
  <text x="250" y="25" text-anchor="middle" font-size="16" font-weight="bold">Wave Types in Different Continuum Media</text>
  <rect x="30" y="40" width="200" height="140" fill="none" stroke="#999" stroke-width="0.5"/>
  <text x="45" y="58" font-size="10" font-weight="bold">Wave type:</text>
  <circle cx="55" cy="70" r="6" fill="#e74c3c"/>
  <text x="70" y="74" font-size="10">P-wave (longitudinal)</text>
  <circle cx="55" cy="90" r="6" fill="#3498db"/>
  <text x="70" y="94" font-size="10">S-wave (transverse)</text>
  <circle cx="55" cy="110" r="6" fill="#2ecc71"/>
  <text x="70" y="114" font-size="10">Thermal wave (T)</text>
  <circle cx="55" cy="130" r="6" fill="#f39c12"/>
  <text x="70" y="134" font-size="10">Coupled mode</text>
  <circle cx="55" cy="150" r="6" fill="#9b59b6"/>
  <text x="70" y="154" font-size="10">Evanescent</text>
  <text x="90" y="210" font-size="12" font-weight="bold">Classical Elastic</text>
  <line x1="50" y1="225" x2="220" y2="225" stroke="#e74c3c" stroke-width="3"/>
  <text x="230" y="229" font-size="10">P-wave: cp = sqrt((lambda+2mu)/rho)</text>
  <line x1="50" y1="245" x2="220" y2="245" stroke="#3498db" stroke-width="3"/>
  <text x="230" y="249" font-size="10">S-wave: cs = sqrt(mu/rho)</text>
  <text x="90" y="280" font-size="12" font-weight="bold">Generalized Thermoelastic</text>
  <line x1="50" y1="295" x2="220" y2="295" stroke="#e74c3c" stroke-width="3"/>
  <text x="230" y="299" font-size="10">P-wave (elastic)</text>
  <line x1="50" y1="315" x2="220" y2="315" stroke="#2ecc71" stroke-width="3"/>
  <text x="230" y="319" font-size="10">T-wave: finite speed cT</text>
  <line x1="50" y1="335" x2="220" y2="335" stroke="#3498db" stroke-width="3"/>
  <text x="230" y="339" font-size="10">S-wave (elastic)</text>
  <text x="300" y="210" font-size="12" font-weight="bold">Piezothermoelastic</text>
  <line x1="260" y1="225" x2="430" y2="225" stroke="#e74c3c" stroke-width="3"/>
  <text x="440" y="229" font-size="10">qP-wave</text>
  <line x1="260" y1="245" x2="430" y2="245" stroke="#3498db" stroke-width="3"/>
  <text x="440" y="249" font-size="10">qS-wave</text>
  <line x1="260" y1="265" x2="430" y2="265" stroke="#2ecc71" stroke-width="3"/>
  <text x="440" y="269" font-size="10">qT-wave</text>
  <line x1="260" y1="285" x2="430" y2="285" stroke="#f39c12" stroke-width="3"/>
  <text x="440" y="289" font-size="10">EM-coupled mode</text>
  <text x="300" y="320" font-size="12" font-weight="bold">Double Porous</text>
  <line x1="260" y1="335" x2="400" y2="335" stroke="#e74c3c" stroke-width="3"/>
  <text x="410" y="339" font-size="10">P1, P2, P3 (3 longitudinal)</text>
  <line x1="260" y1="355" x2="400" y2="355" stroke="#3498db" stroke-width="3"/>
  <text x="410" y="359" font-size="10">S-wave</text>
  <text x="250" y="385" text-anchor="middle" font-size="10" font-style="italic">Classical: non-dispersive | Generalized: dispersive with relaxation | Nonlocal: strongly dispersive</text>
</svg>
