<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700">
  <defs>
    <style>
      .title { font: 700 16px 'DejaVu Sans', sans-serif; fill: #1a3a5c; }
      .subtitle { font: 12px 'DejaVu Sans', sans-serif; fill: #555; }
      .label { font: 11px 'DejaVu Sans', sans-serif; fill: #333; }
      .year { font: 700 10px 'DejaVu Sans', sans-serif; fill: #1a3a5c; }
      .box { fill: #eef3f8; stroke: #1a3a5c; stroke-width: 1.5; rx: 4; ry: 4; }
      .box-classical { fill: #e8f4ea; stroke: #2d6a2d; stroke-width: 1.5; rx: 4; ry: 4; }
      .box-generalized { fill: #fdf3e0; stroke: #c07c00; stroke-width: 1.5; rx: 4; ry: 4; }
      .box-fractional { fill: #f0e8ff; stroke: #6a3d9a; stroke-width: 1.5; rx: 4; ry: 4; }
      .box-nonlocal { fill: #fdecea; stroke: #c0392b; stroke-width: 1.5; rx: 4; ry: 4; }
      .box-coupled { fill: #e8f4f8; stroke: #2980b9; stroke-width: 1.5; rx: 4; ry: 4; }
      .arrow { stroke: #1a3a5c; stroke-width: 1.5; fill: none; marker-end: url(#arrow-flow); }
      .timeline { stroke: #666; stroke-width: 2; fill: none; stroke-dasharray: 5,5; }
    </style>
    <marker id="arrow-flow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <polygon points="0,0 9,4.5 0,9" fill="#1a3a5c"/>
    </marker>
  </defs>

  <rect width="1100" height="700" fill="white"/>

  <text x="550" y="28" class="title" text-anchor="middle">Theory family evolution in generalized continuum mechanics</text>
  <text x="550" y="46" class="subtitle" text-anchor="middle">Historical development of major theory families from classical to modern multiphysics formulations (Section 2)</text>

  <!-- Timeline axis -->
  <line x1="100" y1="100" x2="1000" y2="100" class="timeline"/>
  <text x="100" y="85" class="year" text-anchor="middle">1822</text>
  <text x="300" y="85" class="year" text-anchor="middle">1948</text>
  <text x="500" y="85" class="year" text-anchor="middle">1967</text>
  <text x="700" y="85" class="year" text-anchor="middle">1972</text>
  <text x="900" y="85" class="year" text-anchor="middle">1991+</text>

  <!-- Classical: Fourier -->
  <rect x="60" y="130" width="180" height="60" class="box-classical"/>
  <text x="150" y="152" class="label" text-anchor="middle" font-weight="bold">Fourier</text>
  <text x="150" y="168" class="label" text-anchor="middle" font-size="9">Heat equation (1822)</text>

  <!-- Classical: Biot -->
  <rect x="60" y="210" width="180" height="60" class="box-classical"/>
  <text x="150" y="232" class="label" text-anchor="middle" font-weight="bold">Biot</text>
  <text x="150" y="248" class="label" text-anchor="middle" font-size="9">Coupled thermoelasticity (1956)</text>

  <!-- Cattaneo/Vernotte -->
  <rect x="260" y="130" width="180" height="60" class="box-generalized"/>
  <text x="350" y="152" class="label" text-anchor="middle" font-weight="bold">Cattaneo / Vernotte</text>
  <text x="350" y="168" class="label" text-anchor="middle" font-size="9">Hyperbolic heat (1948, 1958)</text>

  <!-- Lord-Shulman -->
  <rect x="460" y="130" width="180" height="60" class="box-generalized"/>
  <text x="550" y="152" class="label" text-anchor="middle" font-weight="bold">Lord-Shulman</text>
  <text x="550" y="168" class="label" text-anchor="middle" font-size="9">Single relaxation time (1967)</text>

  <!-- Green-Lindsay -->
  <rect x="660" y="130" width="180" height="60" class="box-generalized"/>
  <text x="750" y="152" class="label" text-anchor="middle" font-weight="bold">Green-Lindsay</text>
  <text x="750" y="168" class="label" text-anchor="middle" font-size="9">Two temperatures (1972)</text>

  <!-- Green-Naghdi -->
  <rect x="860" y="130" width="180" height="60" class="box-generalized"/>
  <text x="950" y="152" class="label" text-anchor="middle" font-weight="bold">Green-Naghdi</text>
  <text x="950" y="168" class="label" text-anchor="middle" font-size="9">Types II/III (1991, 1993)</text>

  <!-- Tzou DPL/TPL -->
  <rect x="260" y="210" width="180" height="60" class="box-generalized"/>
  <text x="350" y="232" class="label" text-anchor="middle" font-weight="bold">Tzou DPL/TPL</text>
  <text x="350" y="248" class="label" text-anchor="middle" font-size="9">Phase-lag models (1995, 1997)</text>

  <!-- Eringen nonlocal -->
  <rect x="460" y="210" width="180" height="60" class="box-nonlocal"/>
  <text x="550" y="232" class="label" text-anchor="middle" font-weight="bold">Eringen nonlocal</text>
  <text x="550" y="248" class="label" text-anchor="middle" font-size="9">Spatial memory (1972, 1974, 1983)</text>

  <!-- Wang-Li MDD -->
  <rect x="660" y="210" width="180" height="60" class="box-fractional"/>
  <text x="750" y="232" class="label" text-anchor="middle" font-weight="bold">Wang-Li MDD</text>
  <text x="750" y="248" class="label" text-anchor="middle" font-size="9">Memory derivative (2011)</text>

  <!-- Povstenko fractional -->
  <rect x="860" y="210" width="180" height="60" class="box-fractional"/>
  <text x="950" y="232" class="label" text-anchor="middle" font-weight="bold">Povstenko fractional</text>
  <text x="950" y="248" class="label" text-anchor="middle" font-size="9">Fractional thermoelasticity (2004, 2009, 2011)</text>

  <!-- Arrows showing theory lineage -->
  <line x1="150" y1="190" x2="150" y2="210" class="arrow"/>
  <line x1="350" y1="190" x2="350" y2="210" class="arrow"/>
  <line x1="550" y1="190" x2="550" y2="210" class="arrow"/>
  <line x1="750" y1="190" x2="750" y2="210" class="arrow"/>
  <line x1="950" y1="190" x2="950" y2="210" class="arrow"/>

  <!-- Cross-connections -->
  <line x1="350" y1="210" x2="550" y2="130" class="arrow" stroke="#c07c00" stroke-width="1"/>
  <line x1="550" y1="210" x2="750" y2="130" class="arrow" stroke="#c07c00" stroke-width="1"/>
  <line x1="350" y1="270" x2="550" y2="210" class="arrow" stroke="#c07c00" stroke-width="1"/>
  <line x1="550" y1="270" x2="950" y2="210" class="arrow" stroke="#6a3d9a" stroke-width="1"/>

  <!-- Theory family grouping boxes -->
  <rect x="40" y="300" width="240" height="120" fill="#f8f9fa" stroke="#cccccc" stroke-width="1"/>
  <text x="55" y="318" class="label" font-weight="bold">Classical</text>
  <text x="55" y="335" class="label" font-size="9">Fourier heat conduction</text>
  <text x="55" y="350" class="label" font-size="9">Classical coupled thermoelasticity</text>
  <text x="55" y="365" class="label" font-size="9">(Biot, 1956)</text>
  <text x="55" y="395" class="label" font-size="9" font-style="italic">Infinite thermal speed</text>

  <rect x="300" y="300" width="240" height="120" fill="#fdf3e0" stroke="#c07c00" stroke-width="1"/>
  <text x="315" y="318" class="label" font-weight="bold">Generalized</text>
  <text x="315" y="335" class="label" font-size="9">LS, GL, GN-II/III</text>
  <text x="315" y="350" class="label" font-size="9">DPL, TPL, MGT</text>
  <text x="315" y="365" class="label" font-size="9">Finite thermal speed</text>
  <text x="315" y="395" class="label" font-size="9" font-style="italic">Relaxation times</text>

  <rect x="560" y="300" width="240" height="120" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="575" y="318" class="label" font-weight="bold">Nonlocal</text>
  <text x="575" y="335" class="label" font-size="9">Eringen nonlocal</text>
  <text x="575" y="350" class="label" font-size="9">Strain-gradient</text>
  <text x="575" y="365" class="label" font-size="9">Size-dependent waves</text>
  <text x="575" y="395" class="label" font-size="9" font-style="italic">Spatial memory</text>

  <rect x="820" y="300" width="240" height="120" fill="#f0e8ff" stroke="#6a3d9a" stroke-width="1"/>
  <text x="835" y="318" class="label" font-weight="bold">Fractional</text>
  <text x="835" y="335" class="label" font-size="9">MDD, fractional</text>
  <text x="835" y="350" class="label" font-size="9">Thermoviscoelastic</text>
  <text x="835" y="365" class="label" font-size="9">Hybrid models</text>
  <text x="835" y="395" class="label" font-size="9" font-style="italic">Temporal memory</text>

  <!-- Physical interpretation -->
  <rect x="40" y="450" width="1020" height="180" fill="#f8f9fa" stroke="#cccccc" stroke-width="1"/>
  <text x="55" y="468" class="label" font-weight="bold">Reading the figure</text>
  <text x="55" y="488" class="label" font-size="10">Vertical arrows show direct theory development (each theory builds on its predecessor).</text>
  <text x="55" y="504" class="label" font-size="10">Diagonal orange arrows show conceptual influence between theory families.</text>
  <text x="55" y="520" class="label" font-size="10">Diagonal purple arrows show fractional/nonlocal connections across families.</text>
  <text x="55" y="536" class="label" font-size="10">Bottom boxes group theories by their dominant physical mechanism.</text>
  <text x="55" y="552" class="label" font-size="10">All generalized theories share the goal of restoring finite thermal wave speed.</text>
  <text x="55" y="568" class="label" font-size="10" font-style="italic">Source: Section 2 literature survey. Years refer to primary publications.</text>
</svg>
