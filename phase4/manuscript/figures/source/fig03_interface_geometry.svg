<svg xmlns="http://www.w3.org/2000/svg" width="500" height="450" viewBox="0 0 500 450" font-family="Arial, sans-serif">
  <text x="250" y="25" text-anchor="middle" font-size="16" font-weight="bold">Interface Reflection and Transmission Geometry</text>
  <line x1="50" y1="225" x2="450" y2="225" stroke="#333" stroke-width="3"/>
  <text x="460" y="220" font-size="10">Interface x3 = 0</text>
  <text x="100" y="200" text-anchor="middle" font-size="12" font-weight="bold">Medium 1</text>
  <text x="100" y="190" text-anchor="middle" font-size="10">x3 &lt; 0</text>
  <text x="400" y="200" text-anchor="middle" font-size="12" font-weight="bold">Medium 2</text>
  <text x="400" y="190" text-anchor="middle" font-size="10">x3 &gt; 0</text>
  <path d="M50,50 L250,225" stroke="#e74c3c" stroke-width="2" fill="none"/>
  <text x="100" y="45" text-anchor="middle" font-size="10" fill="#e74c3c">Incident P-wave</text>
  <path d="M250,225 L50,400" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,5" fill="none"/>
  <text x="100" y="410" text-anchor="middle" font-size="10" fill="#e74c3c">Reflected P-wave</text>
  <path d="M250,225 L100,400" stroke="#3498db" stroke-width="2" stroke-dasharray="5,5" fill="none"/>
  <text x="80" y="410" text-anchor="middle" font-size="10" fill="#3498db">Reflected S</text>
  <path d="M250,225 L450,400" stroke="#2ecc71" stroke-width="2" fill="none"/>
  <text x="400" y="410" text-anchor="middle" font-size="10" fill="#2ecc71">Transmitted qP</text>
  <path d="M250,225 L400,400" stroke="#f39c12" stroke-width="2" fill="none"/>
  <text x="420" y="410" text-anchor="middle" font-size="10" fill="#f39c12">Transmitted qS</text>
  <path d="M250,225 L250,100" stroke="#333" stroke-width="1" marker-end="url(#arrowhead)"/>
  <text x="255" y="150" font-size="10">Normal n = (0,0,1)</text>
  <path d="M100,50 L250,225" stroke="#9b59b6" stroke-width="2" stroke-dasharray="2,2" fill="none"/>
  <text x="130" y="45" text-anchor="middle" font-size="10" fill="#9b59b6">Incident T-wave</text>
  <rect x="50" y="380" width="400" height="50" fill="#f9f9f9" stroke="#ddd" stroke-width="1" rx="4"/>
  <text x="70" y="395" font-size="9">Interface conditions:</text>
  <text x="70" y="408" font-size="9">Displacement continuity: u_i^(1) = u_i^(2)</text>
  <text x="220" y="408" font-size="9">Traction continuity: sigma_j3^(1) = sigma_j3^(2)</text>
  <text x="70" y="421" font-size="9">Thermal: T^(1) = T^(2), q_3^(1) = q_3^(2)</text>
  <text x="220" y="421" font-size="9">Electrical: phi^(1) = phi^(2), D_3^(1) = D_3^(2)</text>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
</svg>
