<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650">
  <defs>
    <style>
      .title { font: 700 16px 'DejaVu Sans', sans-serif; fill: #1a3a5c; }
      .subtitle { font: 12px 'DejaVu Sans', sans-serif; fill: #555; }
      .label { font: 11px 'DejaVu Sans', sans-serif; fill: #333; }
      .math { font: 12px 'DejaVu Sans', monospace; fill: #1a3a5c; }
      .body { fill: #eef3f8; stroke: #1a3a5c; stroke-width: 1.5; }
      .vector { stroke: #c0392b; stroke-width: 2.5; fill: #c0392b; marker-end: url(#vecarrow); }
      .axis { stroke: #666; stroke-width: 1; fill: none; marker-end: url(#axisarrow); }
      .dashed { stroke: #8fa8bd; stroke-width: 1; stroke-dasharray: 5,4; fill: none; }
      .point { fill: #1a3a5c; }
      .strain-box { fill: #fdeaea; stroke: #c0392b; stroke-width: 1.5; rx: 5; ry: 5; }
      .rot-box { fill: #e8f0ff; stroke: #2980b9; stroke-width: 1.5; rx: 5; ry: 5; }
    </style>
    <marker id="vecarrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <polygon points="0,0 9,4.5 0,9" fill="#c0392b"/>
    </marker>
    <marker id="axisarrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0,0 7,3.5 0,7" fill="#666"/>
    </marker>
  </defs>
  
  <rect width="1000" height="650" fill="white"/>
  
  <text x="500" y="28" class="title" text-anchor="middle">Fundamental continuum kinematics</text>
  <text x="500" y="46" class="subtitle" text-anchor="middle">Displacement, strain, rotation, and velocity in an infinitesimal continuum element</text>
  
  <!-- Undeformed element (dashed) -->
  <rect x="200" y="200" width="160" height="120" class="dashed"/>
  <text x="280" y="185" class="label" text-anchor="middle">Undeformed configuration</text>
  
  <!-- Deformed element (solid) -->
  <rect x="230" y="180" width="170" height="130" class="body"/>
  <text x="315" y="325" class="label" text-anchor="middle">Deformed configuration</text>
  
  <!-- Displacement vector u -->
  <line x1="280" y1="260" x2="230" y2="180" class="vector"/>
  <text x="250" y="170" class="math" font-size="13">uᵢ</text>
  
  <!-- Coordinate axes -->
  <line x1="150" y1="400" x2="450" y2="400" class="axis"/>
  <line x1="300" y1="250" x2="300" y2="550" class="axis"/>
  <text x="455" y="405" class="label">x₁</text>
  <text x="305" y="555" class="label">x₂</text>
  <text x="310" y="245" class="label" font-size="10">x₃ (out of plane)</text>
  
  <!-- Strain illustration: normal strain -->
  <rect x="420" y="180" width="180" height="140" class="strain-box"/>
  <text x="510" y="200" class="label" text-anchor="middle">Normal strain εᵢᵢ</text>
  <text x="510" y="218" class="math" font-size="13">εᵢᵢ = ∂uᵢ/∂xᵢ</text>
  <line x1="440" y1="250" x2="560" y2="250" class="vector"/>
  <line x1="440" y1="250" x2="455" y2="250" class="dashed"/>
  <text x="500" y="235" class="label" font-size="9">ΔL (change in length)</text>
  
  <!-- Strain illustration: shear strain -->
  <rect x="420" y="360" width="180" height="140" class="strain-box"/>
  <text x="510" y="380" class="label" text-anchor="middle">Shear strain εᵢⱼ (i ≠ j)</text>
  <text x="510" y="398" class="math" font-size="13">εᵢⱼ = ½(∂uᵢ/∂xⱼ + ∂uⱼ/∂xᵢ)</text>
  <path d="M 440 400 Q 500 400 500 460" class="vector"/>
  <path d="M 440 400 L 500 400" class="dashed"/>
  <text x="480" y="388" class="label" font-size="9">Angle change Δθ</text>
  
  <!-- Rotation tensor -->
  <rect x="680" y="200" width="160" height="100" class="rot-box"/>
  <text x="760" y="220" class="label" text-anchor="middle">Rotation tensor ωᵢⱼ</text>
  <text x="760" y="238" class="math" font-size="13">ωᵢⱼ = ½(∂uᵢ/∂xⱼ − ∂uⱼ/∂xᵢ)</text>
  <circle cx="760" cy="270" r="25" fill="none" stroke="#2980b9" stroke-width="1.5"/>
  <path d="M 760 270 L 785 270" class="vector"/>
  <path d="M 760 270 L 760 245" class="dashed"/>
  <text x="775" y="255" class="label" font-size="9">Rigid-body rotation</text>
  
  <!-- Velocity field -->
  <rect x="680" y="340" width="160" height="100" class="rot-box"/>
  <text x="760" y="360" class="label" text-anchor="middle">Velocity field vᵢ</text>
  <text x="760" y="378" class="math" font-size="13">vᵢ = ∂uᵢ/∂t = u̇ᵢ</text>
  <line x1="760" y1="400" x2="810" y2="400" class="vector"/>
  <text x="815" y="405" class="label" font-size="9">Material time derivative</text>
  
  <!-- Key equations summary -->
  <rect x="60" y="490" width="400" height="130" fill="#f8f9fa" stroke="#cccccc" stroke-width="1"/>
  <text x="75" y="510" class="label" font-weight="bold">Key definitions:</text>
  <text x="75" y="530" class="math" font-size="11">uᵢ,ⱼ = εᵢⱼ + ωᵢⱼ  (displacement gradient decomposition)</text>
  <text x="75" y="550" class="math" font-size="11">εᵢⱼ = ½(uᵢ,ⱼ + uⱼ,ᵢ)  (infinitesimal strain)</text>
  <text x="75" y="570" class="math" font-size="11">ωᵢⱼ = ½(uᵢ,ⱼ − uⱼ,ᵢ)  (rotation tensor)</text>
  <text x="75" y="590" class="math" font-size="11">vᵢ = u̇ᵢ  (velocity)</text>
  
  <!-- Notes -->
  <text x="480" y="630" class="subtitle" font-size="10" text-anchor="middle">Infinitesimal strain assumption: ‖εᵢⱼ‖ ≪ 1. Valid for linearized wave propagation.</text>
</svg>