<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700">
  <defs>
    <style>
      .title { font: 700 16px 'DejaVu Sans', sans-serif; fill: #1a3a5c; }
      .subtitle { font: 12px 'DejaVu Sans', sans-serif; fill: #555; }
      .label { font: 11px 'DejaVu Sans', sans-serif; fill: #333; }
      .math { font: 12px 'DejaVu Sans', monospace; fill: #1a3a5c; }
      .axis { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrow-axis); }
      .curve-elastic { stroke: #2d6a2d; stroke-width: 3; fill: none; }
      .curve-thermal { stroke: #c0392b; stroke-width: 3; fill: none; }
      .curve-coupled { stroke: #2980b9; stroke-width: 3; fill: none; }
      .grid { stroke: #e0e0e0; stroke-width: 0.5; fill: none; }
      .marker { fill: #1a3a5c; }
      .box { fill: #f8f9fa; stroke: #cccccc; stroke-width: 1; }
      .box-title { font: 700 11px 'DejaVu Sans', sans-serif; fill: #1a3a5c; }
    </style>
    <marker id="arrow-axis" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <polygon points="0,0 9,4.5 0,9" fill="#333"/>
    </marker>
  </defs>

  <rect width="1100" height="700" fill="white"/>

  <text x="550" y="28" class="title" text-anchor="middle">Constitutive relations and thermoelastic coupling</text>
  <text x="550" y="46" class="subtitle" text-anchor="middle">Stress-strain response under isothermal and non-isothermal conditions (Section 3.5)</text>

  <!-- Main plot area -->
  <rect x="100" y="80" width="650" height="420" fill="#fdfdfd" stroke="#cccccc" stroke-width="1"/>

  <!-- Grid -->
  <line x1="100" y1="150" x2="750" y2="150" class="grid"/>
  <line x1="100" y1="250" x2="750" y2="250" class="grid"/>
  <line x1="100" y1="350" x2="750" y2="350" class="grid"/>
  <line x1="225" y1="80" x2="225" y2="500" class="grid"/>
  <line x1="350" y1="80" x2="350" y2="500" class="grid"/>
  <line x1="475" y1="80" x2="475" y2="500" class="grid"/>
  <line x1="600" y1="80" x2="600" y2="500" class="grid"/>

  <!-- Axes -->
  <line x1="100" y1="500" x2="760" y2="500" class="axis"/>
  <line x1="225" y1="80" x2="225" y2="500" class="axis"/>

  <!-- Axis labels -->
  <text x="770" y="520" class="label" text-anchor="middle">Strain ε<sub>kk</sub></text>
  <text x="85" y="290" class="label" text-anchor="middle" transform="rotate(-90 85 290)">Stress σ<sub>kk</sub> = λε<sub>kk</sub> - βT</text>

  <!-- Tick labels -->
  <text x="225" y="515" class="label" text-anchor="middle" font-size="10">0</text>
  <text x="350" y="515" class="label" text-anchor="middle" font-size="10">+ε</text>
  <text x="475" y="515" class="label" text-anchor="middle" font-size="10">+2ε</text>
  <text x="600" y="515" class="label" text-anchor="middle" font-size="10">+3ε</text>
  <text x="90" y="150" class="label" text-anchor="end" font-size="10">+σ<sub>0</sub></text>
  <text x="90" y="250" class="label" text-anchor="end" font-size="10">0</text>
  <text x="90" y="350" class="label" text-anchor="end" font-size="10">-σ<sub>0</sub></text>

  <!-- Elastic curve (isothermal, T=T0): Hooke's law -->
  <path d="M 225 350 Q 350 250 475 150" class="curve-elastic"/>
  <text x="490" y="140" class="label" font-size="10" fill="#2d6a2d">Isothermal: σ = λε</text>

  <!-- Thermal curve (strain=0, thermal stress only): horizontal line shifted -->
  <path d="M 225 230 L 475 230" class="curve-thermal"/>
  <text x="490" y="220" class="label" font-size="10" fill="#c0392b">Thermal: σ = -βT</text>

  <!-- Coupled curve: combined -->
  <path d="M 225 360 Q 350 240 475 130" class="curve-coupled"/>
  <text x="490" y="160" class="label" font-size="10" fill="#2980b9">Coupled: σ = λε - βT</text>

  <!-- Origin point -->
  <circle cx="225" cy="250" r="4" class="marker"/>
  <text x="200" y="515" class="label" text-anchor="middle" font-size="10">0</text>

  <!-- Legend box -->
  <rect x="780" y="80" width="300" height="200" class="box"/>
  <text x="795" y="98" class="box-title">Constitutive regimes</text>
  <text x="795" y="120" class="math" font-size="10">σ<sub>ij</sub> = λε<sub>kk</sub>δ<sub>ij</sub> + 2με<sub>ij</sub></text>
  <text x="795" y="135" class="label" font-size="10">Hooke's law (elastic)</text>
  <text x="795" y="155" class="math" font-size="10">σ<sub>kk</sub> = -3βT</text>
  <text x="795" y="170" class="label" font-size="10">Thermal stress (free expansion)</text>
  <text x="795" y="190" class="math" font-size="10">σ<sub>ij</sub> = Cε - βTδ<sub>ij</sub></text>
  <text x="795" y="205" class="label" font-size="10">Thermoelastic coupling</text>
  <text x="795" y="225" class="math" font-size="10">ψ = ψ(ε<sub>ij</sub>, T)</text>
  <text x="795" y="240" class="label" font-size="10">Free energy (Coleman-Noll)</text>

  <!-- Equations box -->
  <rect x="780" y="300" width="300" height="220" class="box"/>
  <text x="795" y="318" class="box-title">Key equations (Section 3)</text>
  <text x="795" y="338" class="math" font-size="10">Eq. (3.21) Linear isotropic stress</text>
  <text x="795" y="353" class="math" font-size="10">Eq. (3.22) Entropy-strain coupling</text>
  <text x="795" y="368" class="math" font-size="10">Eq. (3.18) Coleman-Noll restrictions</text>
  <text x="795" y="383" class="math" font-size="10">Eq. (3.29) Energy flux J<sub>i</sub></text>
  <text x="795" y="398" class="math" font-size="10">Eq. (3.31) Interface conditions</text>

  <!-- Physical interpretation -->
  <rect x="100" y="520" width="980" height="150" class="box"/>
  <text x="115" y="538" class="box-title">Physical interpretation</text>
  <text x="115" y="558" class="label" font-size="10">The first two terms of Eq. (3.21) are classical elastic stress (Hooke's law).</text>
  <text x="115" y="573" class="label" font-size="10">The last term (-βTδ<sub>ij</sub>) is thermal stress: temperature changes induce stress.</text>
  <text x="115" y="588" class="label" font-size="10">Eq. (3.22) shows deformation changes entropy: mechanical work is converted to thermal energy.</text>
  <text x="115" y="603" class="label" font-size="10">This bidirectional coupling is the physical origin of thermoelastic wave propagation.</text>
  <text x="115" y="618" class="label" font-size="10">All generalized theories (LS, GL, GN, DPL, MDD, nonlocal) extend this foundation.</text>
</svg>
