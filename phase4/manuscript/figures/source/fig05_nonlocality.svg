<svg xmlns="http://www.w3.org/2000/svg" width="500" height="400" viewBox="0 0 500 400" font-family="Arial, sans-serif">
  <text x="250" y="25" text-anchor="middle" font-size="16" font-weight="bold">Nonlocality: Stress at a Point Depends on Neighborhood</text>
  <g transform="translate(60,80)">
    <text x="100" y="-10" text-anchor="middle" font-size="12" font-weight="bold">Local elasticity</text>
    <circle cx="100" cy="60" r="35" fill="#e74c3c" opacity="0.3" stroke="#e74c3c" stroke-width="2"/>
    <circle cx="100" cy="60" r="6" fill="#e74c3c"/>
    <text x="100" y="110" text-anchor="middle" font-size="10">sigma_ij(x) = C_ijkl e_kl(x)</text>
    <text x="100" y="128" text-anchor="middle" font-size="9">Stress depends only on local strain</text>
  </g>
  <path d="M200,100 L240,100" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="220" y="85" text-anchor="middle" font-size="10" font-style="italic">-> nonlocal extension</text>
  <g transform="translate(260,80)">
    <text x="100" y="-10" text-anchor="middle" font-size="12" font-weight="bold">Nonlocal elasticity</text>
    <circle cx="100" cy="60" r="55" fill="#3498db" opacity="0.15" stroke="#3498db" stroke-width="2"/>
    <circle cx="100" cy="60" r="30" fill="#3498db" opacity="0.3" stroke="#3498db" stroke-width="1"/>
    <circle cx="100" cy="60" r="6" fill="#3498db"/>
    <text x="100" y="110" text-anchor="middle" font-size="10">sigma_ij(x) = ∫_Ω alpha(x'-x) sigma^local_ij(x') dΩ'</text>
    <text x="100" y="128" text-anchor="middle" font-size="9">Stress depends on strain throughout neighborhood</text>
    <text x="100" y="143" text-anchor="middle" font-size="9">Nonlocal length scale xi = e0 a</text>
  </g>
  <g transform="translate(260,80)">
    <circle cx="70" cy="40" r="3" fill="#3498db" opacity="0.6"/>
    <circle cx="130" cy="40" r="3" fill="#3498db" opacity="0.6"/>
    <circle cx="70" cy="80" r="3" fill="#3498db" opacity="0.6"/>
    <circle cx="130" cy="80" r="3" fill="#3498db" opacity="0.6"/>
    <line x1="100" y1="60" x2="70" y2="40" stroke="#3498db" stroke-width="0.5" opacity="0.4"/>
    <line x1="100" y1="60" x2="130" y2="40" stroke="#3498db" stroke-width="0.5" opacity="0.4"/>
    <line x1="100" y1="60" x2="70" y2="80" stroke="#3498db" stroke-width="0.5" opacity="0.4"/>
    <line x1="100" y1="60" x2="130" y2="80" stroke="#3498db" stroke-width="0.5" opacity="0.4"/>
  </g>
  <rect x="50" y="220" width="400" height="140" fill="#f9f9f9" stroke="#ddd" stroke-width="1" rx="4"/>
  <text x="70" y="240" font-size="11" font-weight="bold">Wave dispersion from nonlocality:</text>
  <text x="70" y="255" font-size="10">c(k) = c0 / sqrt(1 + xi^2 k^2)</text>
  <text x="70" y="275" font-size="9">Long waves (k -> 0): c -> c0 (classical speed)</text>
  <text x="70" y="290" font-size="9">Short waves (k -> infinity): c -> 0 (strongly slowed)</text>
  <text x="250" y="310" text-anchor="middle" font-size="9">Size-dependent wave propagation at micro/nanoscale</text>
  <path d="M70,330 Q200,380 430,330" fill="none" stroke="#3498db" stroke-width="2"/>
  <text x="70" y="345" font-size="8" text-anchor="middle">k -> 0</text>
  <text x="250" y="345" font-size="8" text-anchor="middle">k increasing</text>
  <text x="430" y="345" font-size="8" text-anchor="middle">k -> infinity</text>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
</svg>
