<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="t d">
<title id="t">Model-specific nonlocal and gradient dispersion</title><desc id="d">The displayed one-dimensional laws predict different phase-speed trends. A universal nonlocal energy-flux correction is not asserted.</desc>
<defs><style>text{font-family:'DejaVu Sans',Arial,sans-serif;fill:#19334b}.title{font-size:25px;font-weight:700}.head{font-size:18px;font-weight:700}.body{font-size:16px}.math{font-family:'DejaVu Sans Mono',monospace;font-size:17px}.note{font-size:14px;fill:#52677b}.card{fill:#f3f7fa;stroke:#9fb2c2;stroke-width:2}.open{fill:#fff4df;stroke:#c78b2d;stroke-width:2}.axis{stroke:#546a7d;stroke-width:2}.curve1{stroke:#286b96;stroke-width:4;fill:none}.curve2{stroke:#a4513a;stroke-width:4;fill:none}</style></defs>
<rect width="1000" height="600" fill="white"/><text x="500" y="45" class="title" text-anchor="middle">Spatial nonlocality and gradients: compare specified laws</text>
<rect x="45" y="80" width="570" height="360" rx="12" class="card"/><text x="330" y="115" class="head" text-anchor="middle">One-dimensional phase speed versus wavenumber</text>
<line x1="110" y1="380" x2="555" y2="380" class="axis"/><line x1="110" y1="380" x2="110" y2="160" class="axis"/><text x="600" y="386" class="body" text-anchor="end">k_w</text><text x="70" y="160" class="body">cₚₕ</text>
<path d="M112 190 C200 235 300 295 540 360" class="curve1"/><path d="M112 350 C230 315 355 250 540 165" class="curve2"/><text x="130" y="150" class="body" fill="#286b96">Eringen nonlocal</text><text x="395" y="150" class="body" fill="#a4513a">Positive-gradient bar</text><text x="130" y="415" class="note">Qualitative curves from the two displayed one-dimensional laws only.</text>
<rect x="650" y="80" width="305" height="170" rx="12" class="card"/><text x="802" y="120" class="head" text-anchor="middle">Nonlocal law</text><text x="680" y="163" class="math">ω = c₀k_w/√(1+ξ²k_w²)</text><text x="680" y="195" class="body">ω → c₀/ξ; cₚₕ, cᵍ → 0</text><text x="680" y="225" class="note">As k_w → ∞ (for this law).</text>
<rect x="650" y="270" width="305" height="170" rx="12" class="card"/><text x="802" y="310" class="head" text-anchor="middle">Positive gradient law</text><text x="680" y="353" class="math">c² = c₀²(1+ℓ²k_w²)</text><text x="680" y="385" class="body">Phase speed increases with k_w.</text><text x="680" y="415" class="note">For the stated 1D bar model.</text>
<rect x="45" y="470" width="910" height="85" rx="12" class="open"/><text x="500" y="505" class="head" text-anchor="middle">Energy flux and well-posedness are separate questions</text><text x="500" y="535" class="body" text-anchor="middle">Kernel-, domain-, and boundary-specific derivations are required; no universal extra flux is asserted.</text>
</svg>
