<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650">
  <defs>
    <style>
      .title { font: 700 16px 'DejaVu Sans', sans-serif; fill: #1a3a5c; }
      .subtitle { font: 12px 'DejaVu Sans', sans-serif; fill: #555; }
      .label { font: 11px 'DejaVu Sans', sans-serif; fill: #333; }
      .math { font: 12px 'DejaVu Sans', monospace; fill: #1a3a5c; }
      .head { font: 700 12px 'DejaVu Sans', sans-serif; fill: #1a3a5c; }
      .medium { font: 700 11px 'DejaVu Sans', sans-serif; fill: #1a3a5c; }
      .interface { stroke: #1a3a5c; stroke-width: 3; fill: none; }
      .mech { stroke: #2d6a2d; stroke-width: 3.2; fill: none; }
      .elec { stroke: #2980b9; stroke-width: 3.2; fill: none; }
      .therm { stroke: #c0392b; stroke-width: 3.2; fill: none; }
      .normal { stroke: #666; stroke-width: 1.5; fill: none; }
      .box { fill: #f2f6fa; stroke: #1a3a5c; stroke-width: 1.2; }
      .warn { fill: #fdf3e7; stroke: #e67e22; stroke-width: 1.3; }
    </style>
    <marker id="a-mech" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <polygon points="0,0 9,4.5 0,9" fill="#2d6a2d"/>
    </marker>
    <marker id="a-elec" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <polygon points="0,0 9,4.5 0,9" fill="#2980b9"/>
    </marker>
    <marker id="a-therm" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <polygon points="0,0 9,4.5 0,9" fill="#c0392b"/>
    </marker>
    <marker id="a-norm" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#666"/>
    </marker>
  </defs>

  <rect width="1000" height="650" fill="white"/>

  <text x="500" y="26" class="title" text-anchor="middle">Energy-flux channels in a coupled thermo-piezoelastic medium</text>
  <text x="500" y="44" class="subtitle" text-anchor="middle">Mechanical power, electrical power, and thermal conduction across a bonded interface</text>

  <!-- ============ LEFT: the three channels ============ -->
  <rect x="45" y="66" width="500" height="440" rx="6" class="panel"/>
  <text x="295" y="88" class="head" text-anchor="middle">Three transport channels across the interface</text>

  <!-- interface -->
  <line x1="90" y1="330" x2="500" y2="330" class="interface"/>
  <text x="505" y="335" class="label">Interface x₃ = 0</text>
  <text x="295" y="118" class="medium" text-anchor="middle">Medium 1 (piezo-thermoelastic, x₃ &lt; 0)</text>
  <text x="295" y="470" class="medium" text-anchor="middle">Medium 2 (x₃ &gt; 0)</text>

  <!-- normal -->
  <line x1="270" y1="145" x2="270" y2="440" class="normal" marker-end="url(#a-norm)"/>
  <text x="276" y="140" class="label" font-size="10">normal n̂</text>

  <!-- channel 1: mechanical power -->
  <line x1="140" y1="210" x2="440" y2="210" class="mech" marker-end="url(#a-mech)"/>
  <text x="140" y="200" class="label" font-size="11" fill="#2d6a2d">1 · Mechanical power</text>
  <text x="140" y="232" class="math" font-size="11" fill="#2d6a2d">σⱼᵢ vᵢ</text>

  <!-- channel 2: electrical power -->
  <line x1="140" y1="270" x2="440" y2="270" class="elec" marker-end="url(#a-elec)"/>
  <text x="140" y="260" class="label" font-size="11" fill="#2980b9">2 · Electrical power</text>
  <text x="140" y="292" class="math" font-size="11" fill="#2980b9">−φ Ḋᵢ</text>

  <!-- channel 3: thermal conduction -->
  <line x1="140" y1="395" x2="440" y2="395" class="therm" marker-end="url(#a-therm)"/>
  <text x="140" y="385" class="label" font-size="11" fill="#c0392b">3 · Thermal conduction</text>
  <text x="140" y="417" class="math" font-size="11" fill="#c0392b">(T₀/T) Kᵢ T,ᵢ</text>

  <!-- ============ RIGHT: the flux expression and the identity ============ -->
  <rect x="575" y="66" width="380" height="212" rx="6" class="panel"/>
  <text x="765" y="88" class="head" text-anchor="middle">Normal acoustic energy flux</text>
  <rect x="592" y="100" width="346" height="58" rx="4" class="box"/>
  <text x="765" y="124" class="math" text-anchor="middle" font-size="11">P = −Re[ σ₁₃u̇₁ + σ₃₃u̇₃</text>
  <text x="765" y="142" class="math" text-anchor="middle" font-size="11">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;− φḊ₃ + (T₀/T)K₃T,₃ ]</text>
  <text x="765" y="176" class="label" text-anchor="middle" font-size="10">for the elastic (TS) medium the electrical</text>
  <text x="765" y="190" class="label" text-anchor="middle" font-size="10">channel is absent and Pₑ = −Re[σ₃ₑ₁u̇ₑ₁ + σ₃ₑ₃u̇ₑ₃]</text>
  <text x="765" y="212" class="label" text-anchor="middle" font-size="10">the difference isolates the piezoelectric coupling</text>
  <text x="765" y="238" class="label" text-anchor="middle" font-size="10">computed in the reviewed sources for the elastic,</text>
  <text x="765" y="252" class="label" text-anchor="middle" font-size="10">piezothermoelastic, porous and memory-dependent cases</text>

  <rect x="575" y="294" width="380" height="150" rx="6" class="warn"/>
  <text x="765" y="316" class="head" text-anchor="middle" fill="#a04000">Conservation identity and its preconditions</text>
  <text x="765" y="340" class="math" text-anchor="middle" font-size="12">ΣR + ΣT + A = 1</text>
  <text x="600" y="362" class="label" font-size="10">holds only when (i) the flux is the one belonging to the theory in use,</text>
  <text x="600" y="378" class="label" font-size="10">(ii) the interface is passive, (iii) propagating, evanescent and</text>
  <text x="600" y="394" class="label" font-size="10">attenuating modes are all accounted for, and (iv) complex modes are</text>
  <text x="600" y="410" class="label" font-size="10">normalized consistently. An evanescent mode carries a non-zero</text>
  <text x="600" y="426" class="label" font-size="10">normal complex flux; omitting it is the commonest source of an</text>
  <text x="600" y="442" class="label" font-size="10">apparent absorption coefficient that is not physical.</text>

  <rect x="45" y="520" width="910" height="90" rx="6" class="panel"/>
  <text x="500" y="542" class="head" text-anchor="middle">Why the three channels must be carried together</text>
  <text x="500" y="564" class="label" text-anchor="middle">The mechanical, electrical, and thermal channels are not independent: the piezoelectric coupling</text>
  <text x="500" y="580" class="label" text-anchor="middle">term enters the constitutive relation of the mechanical channel, and the thermal coupling term</text>
  <text x="500" y="596" class="label" text-anchor="middle">βT₀u̇ᵢ,ᵢ enters the thermal one. Dropping any channel changes the partition of energy</text>
  <text x="500" y="612" class="label" text-anchor="middle">between the two media, and therefore changes the reflection and transmission coefficients.</text>

  <text x="500" y="640" class="label" text-anchor="middle" font-size="10">Original figure prepared for this review, after the energy-flux formulation of Section 10.4.</text>
</svg>
