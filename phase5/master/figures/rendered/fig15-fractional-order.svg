<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700">
  <defs>
    <style>
      .title { font: 700 16px 'DejaVu Sans', sans-serif; fill: #1a3a5c; }
      .subtitle { font: 12px 'DejaVu Sans', sans-serif; fill: #555; }
      .label { font: 11px 'DejaVu Sans', sans-serif; fill: #333; }
      .math { font: 12px 'DejaVu Sans', monospace; fill: #1a3a5c; }
      .axis { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrow-axis); }
      .curve-diff { stroke: #2d6a2d; stroke-width: 3; fill: none; }
      .curve-wave { stroke: #c0392b; stroke-width: 3; fill: none; }
      .curve-interp { stroke: #2980b9; stroke-width: 3; fill: none; }
      .grid { stroke: #e0e0e0; stroke-width: 0.5; fill: none; }
      .marker { fill: #1a3a5c; }
      .box { fill: #f8f9fa; stroke: #cccccc; stroke-width: 1; }
      .box-title { font: 700 11px 'DejaVu Sans', sans-serif; fill: #1a3a5c; }
      .zone { fill: #f0f8e8; stroke: none; opacity: 0.3; }
    </style>
    <marker id="arrow-axis" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <polygon points="0,0 9,4.5 0,9" fill="#333"/>
    </marker>
  </defs>

  <rect width="1100" height="700" fill="white"/>

  <text x="550" y="28" class="title" text-anchor="middle">Fractional derivative order and transport behavior</text>
  <text x="550" y="46" class="subtitle" text-anchor="middle">Interpolation between diffusive and wave-like heat transport (Sections 6, 11)</text>

  <!-- Main plot area -->
  <rect x="100" y="80" width="650" height="420" fill="#fdfdfd" stroke="#cccccc" stroke-width="1"/>

  <!-- Zones -->
  <rect x="100" y="80" width="225" height="420" class="zone"/>
  <rect x="525" y="80" width="225" height="420" class="zone"/>

  <!-- Grid -->
  <line x1="100" y1="200" x2="750" y2="200" class="grid"/>
  <line x1="100" y1="350" x2="750" y2="350" class="grid"/>
  <line x1="225" y1="80" x2="225" y2="500" class="grid"/>
  <line x1="350" y1="80" x2="350" y2="500" class="grid"/>
  <line x1="475" y1="80" x2="475" y2="500" class="grid"/>
  <line x1="600" y1="80" x2="600" y2="500" class="grid"/>

  <!-- Axes -->
  <line x1="100" y1="500" x2="760" y2="500" class="axis"/>
  <line x1="325" y1="80" x2="325" y2="500" class="axis"/>

  <!-- Axis labels -->
  <text x="745" y="490" class="label" text-anchor="end">Fractional order α</text>
  <text x="85" y="290" class="label" text-anchor="middle" transform="rotate(-90 85 290)">Transport behavior</text>

  <!-- Tick labels -->
  <text x="100" y="515" class="label" text-anchor="middle" font-size="10">0</text>
  <text x="225" y="515" class="label" text-anchor="middle" font-size="10">0.5</text>
  <text x="325" y="515" class="label" text-anchor="middle" font-size="10">1.0</text>
  <text x="475" y="515" class="label" text-anchor="middle" font-size="10">1.5</text>
  <text x="600" y="515" class="label" text-anchor="middle" font-size="10">2.0</text>
  <text x="60" y="200" class="label" text-anchor="end" font-size="10">Wave-like</text>
  <text x="60" y="350" class="label" text-anchor="end" font-size="10">Diffusive</text>

  <!-- Fractional curve: S-shaped interpolation -->
  <path d="M 100 200 Q 325 350 550 200" class="curve-interp"/>
  <text x="500" y="120" class="label" font-size="10" fill="#2980b9">Fractional diffusion-wave example (see model box)</text>

  <!-- Diffusive regime marker (α = 1) -->
  <circle cx="325" cy="350" r="6" class="marker"/>
  <text x="325" y="365" class="label" text-anchor="middle" font-size="10" fill="#2d6a2d">α = 1: Fourier</text>

  <!-- Wave-like regime marker (α = 2) -->
  <circle cx="550" cy="200" r="6" class="marker"/>
  <text x="550" y="215" class="label" text-anchor="middle" font-size="10" fill="#c0392b">α = 2: Wave equation</text>

  <!-- Intermediate regime (α = 1.5) -->
  <circle cx="437" cy="275" r="6" class="marker"/>
  <text x="437" y="290" class="label" text-anchor="middle" font-size="10" fill="#2980b9">α = 1.5: Intermediate</text>

  <!-- Regime labels -->
  <text x="160" y="120" class="label" text-anchor="middle" font-size="10" fill="#c0392b">Wave-like</text>
  <text x="160" y="135" class="label" text-anchor="middle" font-size="10" fill="#c0392b">(1 &lt; α ≤ 2)</text>
  <text x="160" y="390" class="label" text-anchor="middle" font-size="10" fill="#2d6a2d">Diffusive</text>
  <text x="160" y="405" class="label" text-anchor="middle" font-size="10" fill="#2d6a2d">(0 &lt; α ≤ 1)</text>

  <!-- Legend box -->
  <rect x="780" y="80" width="300" height="220" class="box"/>
  <text x="795" y="98" class="box-title">Fractional models</text>
  <text x="795" y="118" class="math" font-size="10">α = 1: Classical Fourier diffusion</text>
  <text x="795" y="133" class="math" font-size="10">{}^C D<sub>t</sub><sup>1</sup>T = a∇<sup>2</sup>T</text>
  <text x="795" y="153" class="math" font-size="10">1 &lt; α ≤ 2: Wave-like heat propagation</text>
  <text x="795" y="168" class="math" font-size="10">{}^C D<sub>t</sub><sup>α</sup>T = a∇<sup>2</sup>T</text>
  <text x="795" y="188" class="math" font-size="10">α = 2: Classical wave equation</text>
  <text x="795" y="203" class="math" font-size="10">∂<sup>2</sup>T/∂t<sup>2</sup> = a∇<sup>2</sup>T</text>
  <text x="795" y="223" class="math" font-size="10">0 &lt; α &lt; 1: Sub-diffusive</text>

  <!-- Equations box -->
  <rect x="780" y="320" width="300" height="200" class="box"/>
  <text x="795" y="338" class="box-title">Key equations</text>
  <text x="795" y="358" class="math" font-size="10">Eq. (6.3) Fractional heat equation</text>
  <text x="795" y="373" class="math" font-size="10">Eq. (11.1) Fractional thermoelasticity</text>
  <text x="795" y="388" class="math" font-size="10">Eq. (11.2) Fractional Cattaneo equation</text>
  <text x="795" y="403" class="math" font-size="10">Eq. (6.1) Caputo derivative</text>
  <text x="795" y="418" class="math" font-size="10">Eq. (6.2) Riemann-Liouville derivative</text>

  <!-- Physical interpretation -->
  <rect x="100" y="520" width="980" height="150" class="box"/>
  <text x="115" y="538" class="box-title">Physical interpretation</text>
  <text x="115" y="558" class="label" font-size="10">Fractional derivatives introduce memory: the response at time t depends on the history of the stimulus.</text>
  <text x="115" y="573" class="label" font-size="10">The order α controls the interpolation between diffusive (α = 1) and wave-like (α = 2) behavior.</text>
  <text x="115" y="588" class="label" font-size="10">Propagation/support depends on the fractional model; no family-wide finite-speed claim.</text>
  <text x="115" y="603" class="label" font-size="10">Caputo derivative preferred for physical applications (classical initial conditions).</text>
  <text x="115" y="618" class="label" font-size="10">Well-posedness requires model- and space-specific proof.</text>
</svg>
