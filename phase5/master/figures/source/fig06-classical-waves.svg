<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600">
  <defs>
    <style>
      .title { font: 700 16px 'DejaVu Sans', sans-serif; fill: #1a3a5c; }
      .subtitle { font: 12px 'DejaVu Sans', sans-serif; fill: #555; }
      .label { font: 11px 'DejaVu Sans', sans-serif; fill: #333; }
      .math { font: 12px 'DejaVu Sans', monospace; fill: #1a3a5c; }
      .wave-p { stroke: #2d6a2d; stroke-width: 2.5; fill: none; }
      .wave-s { stroke: #c0392b; stroke-width: 2.5; fill: none; }
      .particle { fill: #1a3a5c; }
      .particle-p { fill: #2d6a2d; }
      .particle-s { fill: #c0392b; }
      .axis { stroke: #666; stroke-width: 1.5; fill: none; marker-end: url(#axisarrow); }
      .dashed { stroke: #8fa8bd; stroke-width: 1; stroke-dasharray: 5,4; fill: none; }
      .arrow { stroke: #666; stroke-width: 1.5; fill: #666; marker-end: url(#arrowhead); }
    </style>
    <marker id="axisarrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0,0 7,3.5 0,7" fill="#666"/>
    </marker>
    <marker id="arrowhead" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0,0 7,3.5 0,7" fill="#666"/>
    </marker>
  </defs>

  <rect width="1000" height="600" fill="white"/>

  <text x="500" y="26" class="title" text-anchor="middle">Classical elastic wave propagation</text>
  <text x="500" y="44" class="subtitle" text-anchor="middle">Longitudinal (P) and transverse (S) waves in an isotropic elastic solid</text>

  <!-- Left panel: P-wave -->
  <rect x="40" y="70" width="460" height="240" fill="#f8f9fa" stroke="#cccccc" stroke-width="1"/>
  <text x="270" y="90" class="label" text-anchor="middle" font-weight="bold">Longitudinal (P) wave</text>
  <text x="270" y="108" class="math" font-size="11">c_p = √((λ + 2μ)/ρ)</text>
  <text x="270" y="124" class="label" font-size="10" text-anchor="middle">Compressional motion; polarization parallel to propagation</text>

  <!-- P-wave particles -->
  <g transform="translate(80, 140)">
    <!-- Equilibrium positions (dashed) -->
    <line x1="0" y1="0" x2="340" y2="0" class="dashed"/>
    <circle cx="40" cy="0" r="4" class="particle-p"/>
    <circle cx="100" cy="0" r="4" class="particle-p"/>
    <circle cx="160" cy="0" r="4" class="particle-p"/>
    <circle cx="220" cy="0" r="4" class="particle-p"/>
    <circle cx="280" cy="0" r="4" class="particle-p"/>
    <circle cx="340" cy="0" r="4" class="particle-p"/>

    <!-- Displaced positions (compression) -->
    <line x1="40" y1="20" x2="340" y2="20" class="wave-p"/>
    <circle cx="50" cy="20" r="6" class="particle-p"/>
    <circle cx="95" cy="20" r="6" class="particle-p"/>
    <circle cx="170" cy="20" r="6" class="particle-p"/>
    <circle cx="230" cy="20" r="6" class="particle-p"/>
    <circle cx="300" cy="20" r="6" class="particle-p"/>
    <circle cx="330" cy="20" r="6" class="particle-p"/>

    <!-- Wave propagation arrow -->
    <line x1="340" y1="20" x2="370" y2="20" class="arrow"/>

    <!-- Particle labels -->
    <text x="40" y="40" class="label" font-size="9" text-anchor="middle">x</text>
    <text x="50" y="60" class="label" font-size="9" text-anchor="middle">x+u</text>
  </g>

  <!-- Right panel: S-wave -->
  <rect x="500" y="70" width="460" height="240" fill="#f8f9fa" stroke="#cccccc" stroke-width="1"/>
  <text x="730" y="90" class="label" text-anchor="middle" font-weight="bold">Transverse (S) wave</text>
  <text x="730" y="108" class="math" font-size="11">c_s = √(μ/ρ)</text>
  <text x="730" y="124" class="label" font-size="10" text-anchor="middle">Shear motion; polarization perpendicular to propagation</text>

  <!-- S-wave particles -->
  <g transform="translate(540, 140)">
    <!-- Equilibrium positions (dashed) -->
    <line x1="0" y1="0" x2="340" y2="0" class="dashed"/>
    <circle cx="40" cy="0" r="4" class="particle-s"/>
    <circle cx="100" cy="0" r="4" class="particle-s"/>
    <circle cx="160" cy="0" r="4" class="particle-s"/>
    <circle cx="220" cy="0" r="4" class="particle-s"/>
    <circle cx="280" cy="0" r="4" class="particle-s"/>
    <circle cx="340" cy="0" r="4" class="particle-s"/>

    <!-- Displaced positions (shear) -->
    <path d="M 40 20 Q 90 0 140 20 T 240 20 T 340 20" class="wave-s"/>
    <circle cx="40" cy="20" r="6" class="particle-s"/>
    <circle cx="100" cy="-10" r="6" class="particle-s"/>
    <circle cx="160" cy="20" r="6" class="particle-s"/>
    <circle cx="220" cy="-10" r="6" class="particle-s"/>
    <circle cx="280" cy="20" r="6" class="particle-s"/>
    <circle cx="340" cy="-10" r="6" class="particle-s"/>

    <!-- Wave propagation arrow -->
    <line x1="340" y1="0" x2="370" y2="0" class="arrow"/>

    <!-- Particle labels -->
    <text x="40" y="50" class="label" font-size="9" text-anchor="middle">x</text>
    <text x="40" y="70" class="label" font-size="9" text-anchor="middle">x+u⊥</text>
  </g>

  <!-- Bottom panel: Wave speeds comparison -->
  <rect x="40" y="350" width="920" height="180" fill="#f8f9fa" stroke="#cccccc" stroke-width="1"/>
  <text x="500" y="370" class="label" text-anchor="middle" font-weight="bold">Classical elastic wave speeds</text>

  <!-- Speed comparison bars -->
  <text x="80" y="400" class="label" font-size="10">P-wave speed c_p:</text>
  <rect x="220" y="390" width="340" height="20" fill="#2d6a2d" opacity="0.7"/>
  <text x="575" y="405" class="math" font-size="11">c_p > c_s</text>

  <text x="80" y="430" class="label" font-size="10">S-wave speed c_s:</text>
  <rect x="220" y="420" width="260" height="20" fill="#c0392b" opacity="0.7"/>

  <text x="80" y="460" class="label" font-size="10">Classical thermal diffusion:</text>
  <text x="230" y="465" class="math" font-size="11">∞ (parabolic)</text>

  <!-- Formulas -->
  <text x="650" y="400" class="label" font-size="10">λ, μ: Lamé elastic constants</text>
  <text x="650" y="418" class="label" font-size="10">ρ: mass density</text>
  <text x="650" y="436" class="label" font-size="10">c_p > c_s for stable materials</text>
  <text x="650" y="454" class="label" font-size="10">Classical theory: no thermal wave</text>

  <!-- Notes -->
  <text x="40" y="560" class="subtitle" font-size="10">P-waves involve volume change (compressional); S-waves involve shear (distortional) deformation.</text>
  <text x="40" y="578" class="subtitle" font-size="10">Both propagate without dispersion in classical elasticity. Thermal disturbances diffuse (infinite speed).</text>
</svg>