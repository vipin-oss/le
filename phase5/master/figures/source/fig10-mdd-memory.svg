<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-labelledby="t d">
<title id="t">Memory-dependent constitutive models: evidence and open checks</title><desc id="d">A cautious schematic of the ingredients needed to assess a memory model, with propagation and energy-flux claims marked model-specific and open.</desc>
<defs><style>text{font-family:'DejaVu Sans',Arial,sans-serif;fill:#19334b}.title{font-size:26px;font-weight:700}.head{font-size:19px;font-weight:700}.body{font-size:16px}.note{font-size:14px;fill:#52677b}.card{fill:#f4f7fa;stroke:#9fb2c2;stroke-width:2}.open{fill:#fff4df;stroke:#c78b2d;stroke-width:2}.arrow{stroke:#56758e;stroke-width:3;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#56758e"/></marker></defs>
<rect width="1000" height="580" fill="white"/>
<text x="500" y="48" class="title" text-anchor="middle">Memory-dependent models: what must be checked</text>
<rect x="55" y="105" width="260" height="155" rx="12" class="card"/><text x="185" y="145" class="head" text-anchor="middle">Constitutive operator</text><text x="80" y="185" class="body">Specify the kernel, horizon,</text><text x="80" y="212" class="body">normalization, and initial data.</text><text x="80" y="240" class="note">Source equation: not independently checked</text>
<path d="M315 182 L370 182" class="arrow"/>
<rect x="370" y="105" width="260" height="155" rx="12" class="card"/><text x="500" y="145" class="head" text-anchor="middle">Propagation analysis</text><text x="395" y="185" class="body">Derive dispersion and support</text><text x="395" y="212" class="body">for the selected operator.</text><text x="395" y="240" class="note">No family-wide speed asserted</text>
<path d="M630 182 L685 182" class="arrow"/>
<rect x="685" y="105" width="260" height="155" rx="12" class="open"/><text x="815" y="145" class="head" text-anchor="middle">Energy balance</text><text x="710" y="185" class="body">Derive storage, boundary power,</text><text x="710" y="212" class="body">and dissipation together.</text><text x="710" y="240" class="note">Total flux: OPEN</text>
<rect x="100" y="330" width="800" height="150" rx="12" class="open"/><text x="500" y="370" class="head" text-anchor="middle">Validation checklist</text><text x="145" y="413" class="body">1. Match the exact constitutive equation in the original source.</text><text x="145" y="443" class="body">2. State kernel and parameter restrictions; prove well-posedness for the chosen problem.</text><text x="145" y="473" class="body">3. Use a flux in an interface-energy ratio or benchmark only after checking it against the stated model.</text>
<text x="500" y="535" class="note" text-anchor="middle">This schematic identifies audit tasks; it does not assert a particular MDD kernel or theorem.</text>
</svg>
