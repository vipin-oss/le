<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc">
<title id="title">Energy-balance conventions and open multiphysics flux audit</title>
<desc id="desc">Classical outward-positive energy flux derived for the review, next to open verification tasks for generalized and multiphysics balances.</desc>
<defs>
<style>
text{font-family:'DejaVu Sans',Arial,sans-serif;fill:#17324d}.title{font-size:26px;font-weight:700}.head{font-size:19px;font-weight:700}.body{font-size:16px}.math{font-family:'DejaVu Sans Mono',monospace;font-size:20px}.note{font-size:14px;fill:#465b6e}.panel{fill:#f4f7fa;stroke:#afbdca;stroke-width:2}.good{fill:#e8f5ee;stroke:#3a8560;stroke-width:2}.open{fill:#fff4df;stroke:#c68727;stroke-width:2}
</style>
</defs>
<rect width="1000" height="580" fill="#fff"/>
<text x="500" y="48" class="title" text-anchor="middle">Energy transport: established convention and open balances</text>
<rect x="55" y="90" width="890" height="190" rx="12" class="good"/>
<text x="500" y="128" class="head" text-anchor="middle">Classical local thermoelasticity · outward-positive flux</text>
<text x="500" y="181" class="math" text-anchor="middle">∂ₜ ℰ + ∇·J = ρ f·v</text>
<text x="500" y="225" class="math" text-anchor="middle">ℰ = ½ρ|v|² + ρe     Jᵢ = qᵢ − σᵢⱼvⱼ</text>
<text x="500" y="255" class="note" text-anchor="middle">Derived from momentum balance + first law; e is specific internal energy. No internal heat source shown.</text>
<rect x="55" y="310" width="425" height="190" rx="12" class="open"/>
<text x="267" y="350" class="head" text-anchor="middle">Multiphysics field contributions</text>
<text x="85" y="390" class="body">Electrical / magnetic power</text>
<text x="85" y="419" class="body">Thermal-rate and memory storage</text>
<text x="85" y="448" class="body">Kernel- and domain-dependent boundary power</text>
<text x="85" y="480" class="note">OPEN: derive for each stated constitutive model.</text>
<rect x="520" y="310" width="425" height="190" rx="12" class="panel"/>
<text x="732" y="350" class="head" text-anchor="middle">Interface energy accounting</text>
<text x="550" y="391" class="body">Use the complete, theory-specific flux.</text>
<text x="550" y="420" class="body">State boundary passivity and storage.</text>
<text x="550" y="449" class="body">Evaluate the total field, including cross terms.</text>
<text x="550" y="480" class="note">No universal modal identity is asserted here.</text>
<text x="500" y="545" class="note" text-anchor="middle">This schematic replaces unverified generalized flux and evanescent-mode claims in the earlier artwork.</text>
</svg>
